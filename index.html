  document.getElementById('dprev').innerHTML=`<span class="eyebrow">${st.view?'Por 100 g':'Para '+fmt(g)+' g · % de tu objetivo de hoy'}</span>
  <div class="preview" style="margin-top:6px"><div><b>${fmt(r('k'))}</b><span>kcal · ${fmt(r('k')/G.k*100)}%</span></div><div><b class="mp">${fmt(r('p'),1)}</b><span>proteína g · ${fmt(r('p')/G.p*100)}%</span></div><div><b class="mc">${fmt(r('c'),1)}</b><span>hidratos g</span></div><div><b class="mf">${fmt(r('f'),1)}</b><span>grasa g</span></div></div>
  <div class="ntable" style="margin-top:10px">${MICRO.map(x=>`<div>${META[x].l}</div><div>${fmtN(x,r(x))} ${META[x].u} <span class="muted">· ${fmt(G[x]?r(x)/G[x]*100:0)}%</span></div>`).join('')}</div>
  ${st.view?`<p class="hint" style="margin:8px 0 0">Ración habitual: ${esc(f.pl)} (${fmt(f.pg)} g) · ${fmt(f.v[0]*f.pg/100)} kcal y ${fmt(f.v[1]*f.pg/100,1)} g de proteína por ración.</p>`:''}`;
  updateAddLabel();
}
function drawForm(){
  const st=SH.st,f=st.food;SH.title.textContent=f&&f.id?'Editar alimento':'Nuevo alimento';
  const v=f&&f.v?f.v:Array(18).fill('');
  const ni=k=>{const i=NK.indexOf(k);return `<label>${META[k].l} <input type="number" inputmode="decimal" min="0" step="any" id="nf-${k}" value="${v[i]===''||v[i]==null?'':v[i]}" placeholder="0"><span class="hint">${META[k].u} por 100 g</span></label>`};
  SH.body.innerHTML=`<p class="hint" style="margin:0">Copia los valores de la etiqueta (columna "por 100 g"). Solo nombre y calorías son obligatorios.</p>
  ${SAMPLE&&SAMPLE_IMG?`<div class="btnrow"><label class="pillbtn filebtn">Rellenar con una foto de la etiqueta<input type="file" id="lblfile" accept="${esc((SAMPLE_IMG.mediaTypes||['image/jpeg','image/png']).join(','))}" hidden></label></div><div id="lblstat" hidden></div>`:''}
  <div class="form">
   <label class="full">Nombre <input id="nf-name" type="text" value="${esc(f&&f.n||st.q||'')}" placeholder="Ej. Yogur proteico de fresa"></label>
   <label>Categoría <select id="nf-cat">${Object.entries(CATS).map(([k,l])=>`<option value="${k}" ${(f&&f.cat||'pl')===k?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Ración habitual (g) <input id="nf-pg" type="number" inputmode="decimal" min="1" step="any" value="${f&&f.pg||100}"></label>
   <label class="full">Nombre de la ración <input id="nf-pl" type="text" value="${esc(f&&f.pl||'1 ración')}"></label>
   <div class="formsec">Energía y macros</div>${['k','p','c','f'].map(ni).join('')}
   <div class="formsec">Detalle (opcional)</div>${MICRO.map(ni).join('')}
  </div><div id="nf-err" class="err" hidden></div>`;
  SH.foot.hidden=false;SH.foot.innerHTML=`<button class="btn grow" id="saveFood">Guardar alimento</button>`;
}
function drawNut(){
  const st=SH.st,key=st.key,m=META[key],G=goalsFor(S.cur),list=dayEntries(S.cur),T=sumEntries(list),i=NK.indexOf(key);
  SH.title.textContent=m.l;
  const pct=G[key]?T[key]/G[key]*100:0,isMax=m.t==='max',st2=MCOL[key]?'':statusOf(key,T[key],G);
  const contrib=list.map(e=>({e,v:entryVals(e)[key]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
  const per=st.per||'racion';
  let foods=allFoods().filter(f=>(key==='p'||key==='k'||f.cat!=='su')&&f.v[i]>0);
  const val=f=>per==='racion'?f.v[i]*f.pg/100:per==='100g'?f.v[i]:(f.v[0]>5?f.v[i]/f.v[0]*100:-1);
  foods=foods.filter(f=>val(f)>0).sort((a,b)=>val(b)-val(a)).slice(0,20);
  const left=G[key]-T[key];
  SH.body.innerHTML=`<div class="card"><span class="eyebrow">${S.cur===todayKey()?'Hoy':fdate(S.cur,{weekday:'long',day:'numeric',month:'long'})}</span>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 8px"><b class="num" style="font-size:1.5rem">${fmtN(key,T[key])} <small class="muted" style="font-size:.9rem">/ ${isMax?'máx. ':''}${fmtN(key,G[key])} ${m.u}</small></b><span class="num ${st2}" style="font-weight:600">${fmt(pct)}%</span></div>
    ${bar(pct,st2?'bg-'+st2:'',MCOL[key])}
    <p class="hint" style="margin:8px 0 0">${isMax?(left>=0?`Margen hasta el límite: ${fmtN(key,left)} ${m.u}.`:`Has pasado el límite en ${fmtN(key,-left)} ${m.u}.`):(left>0?`Te faltan ${fmtN(key,left)} ${m.u} para tu objetivo.`:'Objetivo cubierto.')}</p></div>
  ${contrib.length?`<div><span class="eyebrow">De dónde viene hoy</span><div class="ntable" style="margin-top:6px">${contrib.map(x=>`<div>${esc(x.e.name)} <span class="muted">(${fmt(x.e.g)} g)</span></div><div>${fmtN(key,x.v)} ${m.u} · ${fmt(T[key]?x.v/T[key]*100:0)}%</div>`).join('')}</div></div>`:''}
  <div><div class="listhead"><span class="eyebrow">${isMax?'Alimentos con más '+esc(m.l.toLowerCase())+' (para moderar)':'Alimentos ricos en '+esc(m.l.toLowerCase())}</span></div>
  <div class="seg" role="group" aria-label="Comparar" style="margin:8px 0">${[['racion','Por ración'],['100g','Por 100 g']].concat(key==='k'?[]:[['100kcal','Por 100 kcal']]).map(([v,l])=>`<button data-nper="${v}" aria-pressed="${per===v}">${l}</button>`).join('')}</div>
  <div class="flist">${foods.map(f=>foodRow(f,'data-npick',{r:fmtN(key,val(f))+' '+m.u,s:`${per==='racion'?esc(f.pl)+' ('+fmt(f.pg)+' g)':per==='100g'?'por 100 g':'por cada 100 kcal'} · ${fmt(G[key]?val(f)/G[key]*100:0)}% de tu objetivo`})).join('')}</div></div>`;
}
function drawRecipe(){
  const st=SH.st;SH.title.textContent=st.editId?'Editar plato':'Crear plato';
  SH.body.innerHTML=`<p class="hint" style="margin:0">Junta ingredientes con sus gramos (en crudo) y la app calcula el plato. Si lo pesas ya cocinado, pon el peso final para que las raciones salgan exactas.</p>
  <div class="form">
    <label class="full">Nombre del plato <input id="rname" type="text" value="${esc(st.name||'')}" placeholder="Ej. Arroz con pollo de mamá"></label>
    <label>Raciones <input id="rserv" type="number" inputmode="numeric" min="1" step="1" value="${st.serv||1}"></label>
    <label>Peso final cocinado (g) <input id="rcook" type="number" inputmode="decimal" min="0" step="any" value="${st.cooked||''}" placeholder="opcional"></label>
  </div>
  <div><span class="eyebrow">Ingredientes</span><div id="rings"></div></div>
  <input class="search" id="rq" type="search" placeholder="Añadir ingrediente: arroz, pollo, aceite…" value="${esc(st.q||'')}" autocomplete="off">
  <div id="rres"></div><div id="rsum"></div><div id="rerr" class="err" hidden></div>`;
  drawRecipeIngs();drawRecipeRes();drawRecipeSum();
  document.getElementById('rq').addEventListener('input',e=>{st.q=e.target.value;drawRecipeRes()});
  SH.foot.hidden=false;SH.foot.innerHTML=`<button class="btn grow" id="saveRecipe">Guardar plato</button>`;
}
function drawRecipeIngs(){const st=SH.st;document.getElementById('rings').innerHTML=st.ings.length?st.ings.map((g,i)=>`<div class="ing"><span class="n">${esc(g.name)}</span><input type="number" inputmode="decimal" min="0" step="any" data-ingg="${i}" value="${g.g}" aria-label="Gramos de ${esc(g.name)}"><span class="k" id="ingk-${i}">${fmt(g.b[0]*g.g/100)} kcal</span><button data-ingdel="${i}" aria-label="Quitar ${esc(g.name)}">✕</button></div>`).join(''):'<p class="hint" style="margin:6px 0">Busca abajo y toca un alimento para añadirlo.</p>'}
function drawRecipeRes(){const st=SH.st,el=document.getElementById('rres');if(!st.q){el.innerHTML='';return}const l=filterFoods(st.q,'').filter(f=>!f.ing).slice(0,6);el.innerHTML=l.length?`<div class="flist">${l.map(f=>foodRow(f,'data-ingadd')).join('')}</div>`:'<p class="hint">Sin resultados.</p>'}
function recipeTotals(){const st=SH.st;const tot=NK.map(()=>0);let raw=0;st.ings.forEach(g=>{raw+=g.g;g.b.forEach((x,i)=>tot[i]+=x*g.g/100)});const weight=+st.cooked>0?+st.cooked:raw;return {tot,raw,weight}}
function drawRecipeSum(){const st=SH.st,{tot,raw,weight}=recipeTotals(),sv=Math.max(1,+st.serv||1);
  if(!st.ings.length){document.getElementById('rsum').innerHTML='';return}
  const pr=weight/sv;
  document.getElementById('rsum').innerHTML=`<div class="card"><span class="eyebrow">Por ración · ${fmt(pr)} g</span>
  <div class="preview" style="margin-top:6px"><div><b>${fmt(tot[0]/sv)}</b><span>kcal</span></div><div><b class="mp">${fmt(tot[1]/sv,1)}</b><span>proteína g</span></div><div><b class="mc">${fmt(tot[2]/sv,1)}</b><span>hidratos g</span></div><div><b class="mf">${fmt(tot[3]/sv,1)}</b><span>grasa g</span></div></div>
  <p class="hint" style="margin:8px 0 0">Plato entero: ${fmt(tot[0])} kcal · ingredientes ${fmt(raw)} g${+st.cooked>0?' · cocinado '+fmt(weight)+' g':''} · ${fmt(weight?tot[0]/weight*100:0)} kcal por 100 g</p></div>`}

/* ---------- Acciones ---------- */
function addEntry(food,grams,meal,key){dayObj(key).entries.push({id:uid(),fid:food.id,name:food.n,g:Math.round(grams*10)/10,meal,b:food.v.slice(),t:Date.now()});saveDay(key)}
let lastDeleted=null;
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="undo">Deshacer</button>':''}`;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},undo?6000:3500)}
function localGet(k){try{return localStorage.getItem('dm-'+k)}catch(e){return null}}
function localSet(k,v){try{localStorage.setItem('dm-'+k,v)}catch(e){}}
function armed(t,label){if(t.dataset.armed)return true;t.dataset.armed='1';const old=t.textContent;t.textContent=label;setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=old}},4000);return false}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-close],tr[data-mnut]');if(!t)return;
  const ds=t.dataset;
  if('close' in ds){closeSheet();return}
  if(t.classList.contains('tab')){S.view=ds.v;render();window.scrollTo(0,0);return}
  if(ds.day){S.cur=shiftKey(S.cur,+ds.day);render();return}
  if('today' in ds){S.cur=todayKey();render();return}
  if(ds.month){const [y,m]=S.month.split('-').map(Number);S.month=todayKey(new Date(y,m-1+(+ds.month),1)).slice(0,7);render();return}
  if(ds.goday){S.cur=ds.goday;S.view='hoy';render();window.scrollTo(0,0);return}
  if(ds.mnut){S.mnut=ds.mnut;render();document.getElementById('mnut')?.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(ds.wrange){S.wrange=ds.wrange;render();return}
  if(ds.fcat!==undefined){S.cat=ds.fcat;render();return}
  if(t.id==='exportCsv'){exportCsv();return}
  if(t.id==='undo'&&lastDeleted){const {key,entry,idx}=lastDeleted;const d=dayObj(key);d.entries.splice(Math.min(idx,d.entries.length),0,entry);saveDay(key);lastDeleted=null;document.getElementById('toast').hidden=true;render();return}
  // a partir de aquí se modifican datos
  const writes=ds.snap||t.id==='fab'||ds.add||ds.edit||ds.repeat||ds.dtype||ds.water||ds.food||t.id==='newFood'||t.id==='newRecipe'||t.id==='wsave'||ds.wdel||ds.psex||ds.pact||ds.pgoal||ds.pweek||t.id==='resetProfile'||ds.nut;
  if(writes&&!S.ready){toast('Cargando tus datos… un momento.');return}
  if(t.id==='fab'){if(S.view==='mes'){S.view='hoy';S.cur=todayKey();render()}openSheet({mode:'pick',meal:S.cur===todayKey()?defaultMeal():'comida',q:'',cat:''});return}
  if(ds.add){openSheet({mode:'pick',meal:ds.add,q:'',cat:''});return}
  if(ds.nut){openSheet({mode:'nut',key:ds.nut,per:'racion'});return}
  if(ds.edit){const e=dayEntries(S.cur).find(x=>x.id===ds.edit);if(!e)return;const food=findFood(e.fid)||{id:e.fid,n:e.name,v:e.b,pg:e.g,pl:'ración',cat:''};openSheet({mode:'detail',food:{...food,v:e.b},grams:e.g,meal:e.meal,editId:e.id});return}
  if(ds.repeat){const src=dayEntries(shiftKey(S.cur,-1)).filter(e=>e.meal===ds.repeat);const d=dayObj(S.cur);src.forEach(e=>{const n={...e,id:uid(),b:e.b.slice(),t:Date.now()};delete n.pk;d.entries.push(n)});saveDay(S.cur);render();toast(`${mealLabel(ds.repeat)} copiada de ayer`);return}
  if(ds.dtype){const d=dayObj(S.cur);const def=(S.profile.week||DEF_PROFILE.week)[(parseKey(S.cur).getDay()+6)%7];d.type=ds.dtype===def?'':ds.dtype;saveDay(S.cur);render();return}
  if(ds.water){const d=dayObj(S.cur);d.water=Math.max(0,(d.water||0)+(+ds.water));saveDay(S.cur);render();return}
  if(ds.food){openSheet({mode:'detail',food:findFood(ds.food),view:true});return}
  if(t.id==='newFood'){openSheet({mode:'form',food:null});return}
  if(t.id==='newRecipe'){openSheet({mode:'recipe',name:'',ings:[],serv:1,cooked:'',q:''});return}
  if(t.id==='wsave'){saveWeightForm();return}
  if(ds.wdel){if(!armed(t,'¿Borrar?'))return;delete S.weights[ds.wdel];saveWeight(ds.wdel);render();toast('Pesaje borrado');return}
  if(ds.psex){S.profile.sex=ds.psex;saveProfile();render();return}
  if(ds.pact){S.profile.activity=+ds.pact;saveProfile();render();return}
  if(ds.pgoal){S.profile.goal=ds.pgoal;saveProfile();render();return}
  if(ds.pweek){const i=+ds.pweek,order=['entreno','partido','descanso'];const w=[...S.profile.week];w[i]=order[(order.indexOf(w[i])+1)%3];S.profile.week=w;saveProfile();render();return}
  if(t.id==='resetProfile'){if(!armed(t,'Pulsa otra vez para confirmar'))return;S.profile={...DEF_PROFILE,week:[...DEF_PROFILE.week],diet:S.profile.diet};S.goals={...DEFAULT_GOALS};saveProfileNow();saveGoals();render();toast('Perfil restablecido');return}
  if(ds.goto){S.view=ds.goto;render();window.scrollTo(0,0);return}
  const dietBtn=ds.dstyle||ds.dmeals||ds.dkind||ds.dptype||ds.dexcl||ds.dunban||t.id==='dgen'||ds.pswap||ds.pban||ds.pregen||ds.peat||ds.preopt||ds.pregenday||ds.peatday||t.id==='psave'||ds.puse||ds.pdel||t.id==='pclear';
  if(dietBtn&&!S.ready){toast('Cargando tus datos… un momento.');return}
  if(ds.dstyle){setDiet({style:ds.dstyle});render();return}
  if(ds.dmeals){setDiet({meals:+ds.dmeals});render();return}
  if(ds.dkind){setDiet({kind:ds.dkind});S.dstart='';render();return}
  if(ds.dptype){S.dtype=ds.dptype;render();return}
  if(ds.dexcl){const pr=dietPrefs();setDiet({excl:pr.excl.includes(ds.dexcl)?pr.excl.filter(x=>x!==ds.dexcl):[...pr.excl,ds.dexcl]});render();return}
  if(ds.dunban){setDiet({noFoods:dietPrefs().noFoods.filter(x=>x!==ds.dunban)});render();toast('Vuelve a estar permitido');return}
  if(t.id==='dgen'){if(S.plan&&!armed(t,'¿Reemplazar la dieta actual?'))return;S.plan=genPlan();S.pday=S.plan.kind==='semana'?Math.max(0,Math.min(6,daysBetween(S.plan.start,todayKey()))):0;savePlan();render();toast('Dieta generada');return}
  if(ds.pday){S.pday=+ds.pday;render();return}
  if(ds.pswap||ds.pban){if(swapPlanItem(planRef(ds.pswap||ds.pban),!!ds.pban)){savePlan();render();if(ds.pban)toast('No volverá a salir en tus dietas')}return}
  if(ds.pregen){const r=planRef(ds.pregen);regenPlanMeal(r.di,r.mi);savePlan();render();return}
  if(ds.preopt){const day=S.plan.days[+ds.preopt];optimizeDay(day,planTargets(day.type,S.plan.style));savePlan();render();toast('Cantidades reajustadas a tus macros');return}
  if(ds.pregenday){regenPlanDay(+ds.pregenday);savePlan();render();return}
  if(ds.peat){const r=planRef(ds.peat);eatPlanMeal(r.di,r.mi,ds.pdate);render();toast(`${S.plan.days[r.di].meals[r.mi].label}: apuntado en el diario`);return}
  if(ds.peatday){const di=+ds.peatday;let c=0;S.plan.days[di].meals.forEach((m,mi)=>{if(!mealEaten(S.plan,di,mi)){eatPlanMeal(di,mi);c++}});render();toast(c?`${c} comidas apuntadas en el diario del ${fdate(shiftKey(S.plan.start,di))}`:'Ya estaba todo apuntado');return}
  if(t.id==='psave'){const name=(document.getElementById('pname').value||'').trim()||styleLabel(S.plan.style);const id='s-'+uid();S.plan.name=name;S.plans[id]={...clonePlan(S.plan),created:Date.now()};saveSavedPlan(id);savePlan();render();toast(`"${name}" guardada en tus dietas`);return}
  if(ds.puse){const src=S.plans[ds.puse];if(!src)return;if(S.plan&&!armed(t,'¿Reemplazar?'))return;const p=clonePlan(src);p.id='p-'+uid();p.start=p.kind==='semana'?mondayOf(todayKey()):todayKey();p.checked=[];S.plan=p;S.pday=p.kind==='semana'?daysBetween(p.start,todayKey()):0;savePlan();render();toast('Dieta activada');return}
  if(ds.pdel){if(!armed(t,'¿Borrar?'))return;delete S.plans[ds.pdel];saveSavedPlan(ds.pdel);render();return}
  if(t.id==='pclear'){if(!armed(t,'¿Quitar? Pulsa otra vez'))return;S.plan=null;savePlan();render();return}
  if(ds.rtag!==undefined){S.rtag=ds.rtag;render();return}
  const newBtn=ds.rec||ds.fill||ds.aiopen||ds.quick||ds.copyday||ds.tsave||ds.energy||ds.tuse||ds.tdel||['calibOn','calibOff','importGo','aimonth'].includes(t.id);
  if(newBtn&&!S.ready){toast('Cargando tus datos… un momento.');return}
  if(ds.rec){const r=findRecipe(ds.rec);if(!r)return;const st0={mode:'rview',id:r.id,serv:r.s,eat:1,meal:SH.st&&SH.st.meal||defaultMeal()};if(SH.st){st0.prev=SH.st;SH.st=st0;drawSheet()}else openSheet(st0);return}
  if(ds.fill){const st0={mode:'fill',meal:S.cur===todayKey()?defaultMeal():'cena'};genFill(st0);openSheet(st0);return}
  if(ds.snap){openSnap(SH.st&&SH.st.meal);return}
  if(t.id==='keysave'){saveAiFromForm();return}
  if(ds.aiprov){AIUI=ds.aiprov;render();document.getElementById('keybox')?.scrollIntoView({block:'nearest'});return}
  if(t.id==='keytest'){testApiKey();return}
  if(t.id==='keydel'){if(!armed(t,'¿Borrar?'))return;try{localStorage.removeItem(AI_LS);localStorage.removeItem(AIKEY_LS)}catch(e){}AIUI=null;enableApiSample();render();toast('Proveedor desconectado y clave borrada de este dispositivo');return}
  if(ds.aiopen){if(SH.st){SH.st={mode:'ai',meal:SH.st.meal||defaultMeal(),text:'',prev:SH.st};drawSheet()}else openSheet({mode:'ai',meal:S.cur===todayKey()?defaultMeal():'comida',text:''});return}
  if(ds.copyday){const src=dayEntries(shiftKey(S.cur,-1));const d=dayObj(S.cur);src.forEach(e=>{const n={...e,id:uid(),b:e.b.slice(),t:Date.now()};delete n.pk;d.entries.push(n)});saveDay(S.cur);render();toast(`${src.length} alimentos copiados de ayer`);return}
  if(ds.tsave){const tp=templateFromMeal(S.cur,ds.tsave);if(!tp)return;S.templates.unshift(tp);saveTemplates();toast('Guardada. La encontrarás arriba al añadir comida.');return}
  if(ds.energy){const d=dayObj(S.cur),v=+ds.energy;d.energy=d.energy===v?0:v;saveDay(S.cur);t.parentNode.querySelectorAll('[data-energy]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.energy===d.energy));return}
  if(t.id==='aimonth'){runMonthAI(t);return}
  if(t.id==='calibOn'){const r=realTdee();if(r.ok){S.profile.calib=Math.round(r.diff/10)*10;saveProfileNow();render();toast(`Objetivos ajustados a tu gasto real (${r.diff>0?'+':''}${fmt(S.profile.calib)} kcal)`)}return}
  if(t.id==='calibOff'){S.profile.calib=0;saveProfileNow();render();toast('Vuelves a usar la fórmula');return}
  if(t.id==='exportBackup'){exportBackup();return}
  if(t.id==='importGo'){applyImport();return}
  if(t.id==='importCancel'){PENDING_IMPORT=null;render();return}
  if(t.id==='shBack'&&SH.st&&SH.st.prev){SH.st=SH.st.prev;drawSheet();return}
  if(!SH.st)return;
  const st=SH.st;
  if(snapClick(t,ds))return;
  if(ds.pmeal){st.meal=ds.pmeal;drawPick();return}
  if(ds.quick){SH.st={mode:'quick',meal:st.meal||defaultMeal(),prev:st};drawSheet();return}
  if(ds.tuse){const tp=S.templates.find(x=>x.id===ds.tuse);if(!tp)return;tp.items.forEach(i=>addEntry({id:i.fid,n:i.name,v:i.b},i.g,st.meal||tp.meal,S.cur));closeSheet();S.view='hoy';render();toast(`${tp.items.length} alimentos añadidos`);return}
  if(ds.tdel){if(!armed(t,'¿?'))return;S.templates=S.templates.filter(x=>x.id!==ds.tdel);saveTemplates();drawPickList();return}
  if(ds.aimeal){st.meal=ds.aimeal;SH.body.querySelectorAll('[data-aimeal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.aimeal===st.meal));if(st.res){st.res.forEach(x=>{if(!x.mealSet)x.meal=st.meal});drawAIOut()}return}
  if(t.id==='airun'){runAI();return}
  if(t.id==='aistop'){st.ctl&&st.ctl.abort();return}
  if(t.id==='aiadd'){const on=st.res.filter(x=>x.on&&x.g>0);on.forEach(x=>addEntry(x.f.est?{...x.f,n:x.f.n+' (estimado)'}:x.f,x.g,x.meal,S.cur));closeSheet();S.view='hoy';render();toast(`${on.length} alimentos añadidos`);return}
  if(ds.unphoto){delete S.photos[ds.unphoto];savePhoto(ds.unphoto);render();drawSheet();toast('Foto quitada');return}
  if(ds.rserv){st.serv=Math.max(1,Math.min(12,st.serv+(+ds.rserv)));drawRView();return}
  if(ds.reat){st.eat=+ds.reat;drawRView();return}
  if(ds.rmeal){st.meal=ds.rmeal;drawRView();return}
  if(t.id==='radd'){const f=findFood('r-'+st.id);addEntry(f,Math.round(f.pg*st.eat),st.meal,S.cur);closeSheet();render();toast(`${f.n}: añadido a ${mealLabel(st.meal).toLowerCase()}`);return}
  if(t.id==='rsave'){const r=findRecipe(st.id),f=recFood(r);S.foods.unshift({id:'u-'+uid(),n:r.n+' (mi versión)',cat:'pl',v:f.v.slice(),pg:f.pg,pl:'1 ración',ing:r.ing.map(([n,g])=>{const b=BASE.find(x=>x.n===n);return {fid:b.id,name:n,g,b:b.v.slice()}}),serv:r.s,cooked:0});saveFoods();render();toast('Copiada a tus platos: puedes editar los ingredientes en Alimentos › Míos');return}
  if(ds.fmeal){st.meal=ds.fmeal;genFill(st);drawFill();return}
  if(ds.fswap){const m=st.day.meals[0],i=+ds.fswap,it=m.items[i];const used=new Set(dayEntries(S.cur).map(e=>e.fid));m.items.forEach(x=>{if(x!==it)used.add(x.fid)});const n=pickItem(it.role,dietPrefs(),st.key,used,new Set(),it.fid);if(!n){toast('No hay más alternativas con tus restricciones.');return}m.items[i]=n;optimizeDay(st.day,st.T);drawFill();return}
  if(ds.fdel){st.day.meals[0].items.splice(+ds.fdel,1);optimizeDay(st.day,st.T);drawFill();return}
  if(t.id==='fregen'){genFill(st);drawFill();return}
  if(t.id==='fadd'){const its=st.day.meals[0].items.filter(i=>i.g>0);its.forEach(i=>addEntry({id:i.fid,n:i.name,v:i.b},i.g,st.meal,S.cur));closeSheet();render();toast(`${its.length} alimentos añadidos a ${mealLabel(st.meal).toLowerCase()}`);return}
  if(ds.qmeal){st.meal=ds.qmeal;SH.body.querySelectorAll('[data-qmeal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.qmeal===st.meal));return}
  if(t.id==='qadd'){const g=id=>{const x=parseFloat(String(document.getElementById(id).value).replace(',','.'));return x>=0?x:0};let k=g('qk');const pp=g('qp'),cc=g('qc'),ff=g('qf');if(!k)k=Math.round(pp*4+cc*4+ff*9);if(!(k>0)){toast('Pon al menos las calorías o los macros.');return}
    const v=NK.map(()=>0);v[0]=k;v[1]=pp;v[2]=cc;v[3]=ff;addEntry({id:'q-'+uid(),n:(document.getElementById('qn').value||'').trim()||'Añadido rápido',v},100,st.meal,S.cur);closeSheet();S.view='hoy';render();toast(`${fmt(k)} kcal añadidas`);return}
  if(ds.pcat!==undefined){st.cat=ds.pcat;drawPick();return}
  if(ds.pick||ds.npick){const f=findFood(ds.pick||ds.npick);SH.st={mode:'detail',food:f,grams:f.pg,meal:st.meal||defaultMeal(),prev:st};drawSheet();return}
  if(ds.nper){st.per=ds.nper;drawNut();return}
  if(ds.newfrom){SH.st={mode:'form',food:null,q:st.q,prev:st,meal:st.meal};drawSheet();return}
  if(ds.newrecipefrom){SH.st={mode:'recipe',name:st.q||'',ings:[],serv:1,cooked:'',q:'',prev:st,meal:st.meal};drawSheet();return}
  if(ds.fav){const id=ds.fav;S.favs=isFav(id)?S.favs.filter(x=>x!==id):[id,...S.favs];saveFavs();t.outerHTML=favBtn(st.food);if(S.view==='alimentos'&&document.getElementById('flist'))document.getElementById('flist').innerHTML=foodListHTML();return}
  if(ds.portion){st.grams=+ds.portion;document.getElementById('grams').value=st.grams;drawPreview();return}
  if(ds.dmeal){st.meal=ds.dmeal;SH.body.querySelectorAll('[data-dmeal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dmeal===st.meal));updateAddLabel();return}
  if(t.id==='addEntry'){if(!(st.grams>0)){toast('Indica una cantidad mayor que 0 g');return}addEntry(st.food,st.grams,st.meal,S.cur);closeSheet();S.view='hoy';render();toast(`${st.food.n} añadido`);return}
  if(t.id==='saveEntry'){const e=dayEntries(S.cur).find(x=>x.id===st.editId);if(e&&st.grams>0){e.g=Math.round(st.grams*10)/10;e.meal=st.meal;saveDay(S.cur)}closeSheet();render();return}
  if(t.id==='delEntry'){const l=dayEntries(S.cur);const idx=l.findIndex(x=>x.id===st.editId);if(idx>=0){lastDeleted={key:S.cur,entry:l[idx],idx};l.splice(idx,1);saveDay(S.cur)}closeSheet();render();toast('Alimento eliminado del día',true);return}
  if(t.id==='toLog'){S.cur=todayKey();SH.st={mode:'detail',food:st.food,grams:st.food.pg,meal:defaultMeal(),prev:st};drawSheet();return}
  if(ds.editfood){const f=st.food;SH.st=f.ing?{mode:'recipe',editId:f.id,name:f.n,ings:f.ing.map(i=>({...i,b:[...i.b]})),serv:f.serv||1,cooked:f.cooked||'',q:'',prev:st}:{mode:'form',food:f,prev:st};drawSheet();return}
  if(t.id==='delFood'){if(!armed(t,'¿Seguro? Pulsa de nuevo'))return;S.foods=S.foods.filter(f=>f.id!==st.food.id);S.favs=S.favs.filter(x=>x!==st.food.id);saveFoods();saveFavs();closeSheet();render();toast('Alimento eliminado. Tus registros pasados se mantienen.');return}
  if(t.id==='saveFood'){saveFoodForm();return}
  if(ds.ingadd){const f=findFood(ds.ingadd);st.ings.push({fid:f.id,name:f.n,g:f.pg,b:f.v.slice()});st.q='';document.getElementById('rq').value='';drawRecipeIngs();drawRecipeRes();drawRecipeSum();return}
  if(ds.ingdel){st.ings.splice(+ds.ingdel,1);drawRecipeIngs();drawRecipeSum();return}
  if(t.id==='saveRecipe'){saveRecipe();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!SH.el.hidden)closeSheet();if(e.key==='Enter'&&SH.st&&SH.st.mode==='detail'&&!SH.st.view&&e.target.id==='grams'){(document.getElementById('addEntry')||document.getElementById('saveEntry'))?.click()}});
document.addEventListener('toggle',e=>{const c=e.target.classList;if(!c)return;if(c.contains('micros'))localSet('microsOpen',e.target.open?'1':'0');if(c.contains('planpanel'))localSet('planOpen',e.target.open?'1':'0');if(c.contains('badges'))localSet('badgesOpen',e.target.open?'1':'0')},true);
document.addEventListener('change',e=>{
  const el=e.target;
  if(snapChange(el))return;
  if(el.id==='mnut'){S.mnut=el.value;el.blur();render();return}
  if(el.id==='fsort'){S.sort=el.value;document.getElementById('flist').innerHTML=foodListHTML();return}
  if(el.id==='dstart'){if(el.value){S.dstart=el.value;S.dtype=''}render();return}
  if(el.id==='rsort'){S.rsort=el.value;document.getElementById('rlist').innerHTML=recipeListHTML();return}
  if(el.dataset.photo){const f=el.files&&el.files[0];if(f&&S.ready)setDishPhoto(el.dataset.photo,f);el.value='';return}
  if(el.id==='aiphoto'&&SH.st&&SH.st.mode==='ai'){const f=el.files&&el.files[0];if(f){const st=SH.st;if(st.photoUrl)URL.revokeObjectURL(st.photoUrl);st.photo=f;st.photoUrl=URL.createObjectURL(f);st.res=null;st.err='';drawAI()}el.value='';return}
  if(el.id==='lblfile'){const f=el.files&&el.files[0];if(f)readLabel(f);el.value='';return}
  if(el.id==='importFile'){const f=el.files&&el.files[0];if(f)readBackupFile(f);el.value='';return}
  if(el.dataset.prof&&el.type!=='range'){if(!S.ready)return;const x=parseFloat(String(el.value).replace(',','.'));if(!(x>0)){el.value=S.profile[el.dataset.prof];return}S.profile[el.dataset.prof]=x;saveProfile();refreshProfileOutputs();return}
  if(el.id==='dsleep'){if(!S.ready)return;const x=parseFloat(String(el.value).replace(',','.'));const d=dayObj(S.cur);d.sleep=x>0&&x<=24?x:0;saveDay(S.cur);return}
  if(SH.st&&SH.st.mode==='ai'&&SH.st.res){const st=SH.st;
    if(el.dataset.aion!==undefined){st.res[+el.dataset.aion].on=el.checked;drawAI();return}
    if(el.dataset.aim!==undefined){const x=st.res[+el.dataset.aim];x.meal=el.value;x.mealSet=true;return}
    if(el.dataset.aig!==undefined){const g=parseFloat(String(el.value).replace(',','.'));if(g>0)st.res[+el.dataset.aig].g=g;drawAIOut();return}}
  if(SH.st&&SH.st.mode==='fill'&&el.dataset.fg!==undefined){const g=parseFloat(String(el.value).replace(',','.'));if(g>=0)SH.st.day.meals[0].items[+el.dataset.fg].g=g;drawFill();return}
  if(!S.ready&&(el.id==='dfav'||el.dataset.pg||el.dataset.shop))return;
  if(el.id==='dfav'){setDiet({favs:el.checked});return}
  if(el.dataset.pg){const r=planRef(el.dataset.pg),it=r.day.meals[r.mi].items[r.ii],g=parseFloat(String(el.value).replace(',','.'));if(g>=0){it.g=g;savePlan();render()}return}
  if(el.dataset.shop){const id=el.dataset.shop;S.plan.checked=el.checked?[...new Set([...S.plan.checked,id])]:S.plan.checked.filter(x=>x!==id);el.closest('.shopitem').classList.toggle('ck',el.checked);savePlan();return}
  if(el.id==='pauto'){if(!S.ready){el.checked=!el.checked;return}S.profile.auto=el.checked;if(!el.checked)S.goals={...calc().goals};saveProfileNow();if(!el.checked)saveGoals();render();return}
});
document.addEventListener('input',e=>{
  const el=e.target,ds=el.dataset||{};
  if(snapInput(el))return;
  if(el.id==='fq'){S.q=el.value;document.getElementById('flist').innerHTML=foodListHTML();return}
  if(el.id==='rq'){S.rq=el.value;document.getElementById('rlist').innerHTML=recipeListHTML();return}
  if(el.id==='dnote'){if(!S.ready)return;const k=S.cur;dayObj(k).note=el.value.slice(0,1000);clearTimeout(saveDay.h);saveDay.h=setTimeout(()=>saveDay(k),800);return}
  if(ds.goal){if(!S.ready)return;const x=parseFloat(String(el.value).replace(',','.'));if(!(x>=0))return;S.goals[ds.goal]=x;clearTimeout(saveGoals.h);saveGoals.h=setTimeout(saveGoals,700);return}
  if(ds.prof){if(!S.ready||el.type!=='range')return;const x=parseFloat(String(el.value).replace(',','.'));if(!(x>0))return;S.profile[ds.prof]=x;saveProfile();refreshProfileOutputs();return}
  if(SH.st&&SH.st.mode==='recipe'){const st=SH.st;
    if(el.id==='rname')st.name=el.value;
    else if(el.id==='rserv'){st.serv=Math.max(1,parseInt(el.value)||1);drawRecipeSum()}
    else if(el.id==='rcook'){st.cooked=parseFloat(el.value)||'';drawRecipeSum()}
    else if(ds.ingg!==undefined){const g=st.ings[+ds.ingg];g.g=parseFloat(String(el.value).replace(',','.'))||0;document.getElementById('ingk-'+ds.ingg).textContent=fmt(g.b[0]*g.g/100)+' kcal';drawRecipeSum()}}
});

function saveWeightForm(){
  const g=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'));
  const k=document.getElementById('wdate').value||todayKey(),kg=g('wkg'),waist=g('wwaist'),bf=g('wbf');
  if(!(kg>=20&&kg<=400)){toast('Escribe un peso válido en kg.');return}
  if(k>todayKey()){toast('La fecha no puede ser futura.');return}
  S.weights[k]={kg:Math.round(kg*10)/10,waist:waist>0?waist:0,bf:bf>0?bf:0};saveWeight(k);
  if(S.profile.weight!==kg&&k===weightKeys().slice(-1)[0]){S.profile.weight=Math.round(kg*10)/10;saveProfile()}
  render();toast(`Pesaje guardado: ${fmt(kg,1)} kg`);
}
function saveFoodForm(){
  const st=SH.st,get=id=>document.getElementById(id);
  const name=get('nf-name').value.trim(),err=get('nf-err');
  const kc=parseFloat(String(get('nf-k').value).replace(',','.'));
  if(!name){err.textContent='Escribe un nombre para el alimento.';err.hidden=false;return}
  if(!(kc>=0)){err.textContent='Indica las kcal por 100 g (puede ser 0).';err.hidden=false;return}
  const v=NK.map(k=>{const x=parseFloat(String(get('nf-'+k).value).replace(',','.'));return isFinite(x)&&x>=0?x:0});
  const pg=parseFloat(get('nf-pg').value)||100;
  const old=st.food&&st.food.own?st.food:null;
  const f={id:old?old.id:'u-'+uid(),n:name,cat:get('nf-cat').value,v,pg,pl:get('nf-pl').value.trim()||'1 ración'};
  if(old)S.foods=S.foods.map(x=>x.id===old.id?f:x);else S.foods.unshift(f);
  saveFoods();finishFoodSave(st,{...f,own:true},!!old);
}
function saveRecipe(){
  const st=SH.st,err=document.getElementById('rerr');
  const name=(st.name||'').trim();
  if(!name){err.textContent='Ponle un nombre al plato.';err.hidden=false;return}
  if(!st.ings.length){err.textContent='Añade al menos un ingrediente.';err.hidden=false;return}
  const {tot,weight}=recipeTotals();if(!(weight>0)){err.textContent='Los ingredientes tienen que sumar más de 0 g.';err.hidden=false;return}
  const sv=Math.max(1,+st.serv||1),v=tot.map(x=>Math.round(x/weight*100*100)/100);
  const f={id:st.editId||'u-'+uid(),n:name,cat:'pl',v,pg:Math.round(weight/sv),pl:'1 ración',ing:st.ings.map(i=>({fid:i.fid,name:i.name,g:i.g,b:i.b})),serv:sv,cooked:+st.cooked||0};
  if(st.editId)S.foods=S.foods.map(x=>x.id===st.editId?f:x);else S.foods.unshift(f);
  saveFoods();finishFoodSave(st,{...f,own:true},!!st.editId);
}
function finishFoodSave(st,f,edited){
  let p=st.prev;while(p&&p.mode!=='pick')p=p.prev;
  if(p){SH.st={mode:'detail',food:f,grams:f.pg,meal:p.meal||defaultMeal(),prev:p};drawSheet()}else closeSheet();
  render();toast(edited?'Guardado':`"${f.n}" creado`);
}
async function exportCsv(){
  const keys=monthKeys(S.month).filter(k=>dayEntries(k).length);
  const head=['fecha','tipo_de_dia','comida','alimento','gramos',...NK.map(k=>META[k].l+' ('+META[k].u+')')];
  const rows=[head];keys.forEach(k=>dayEntries(k).forEach(e=>{const v=entryVals(e);rows.push([k,dayType(k),e.meal,e.name,e.g,...NK.map(x=>Math.round(v[x]*100)/100)])}));
  const csv=rows.map(r=>r.map(c=>{const s=String(c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  saveFile('diario-macros-'+S.month+'.csv','\ufeff'+csv,'text/csv');
}

/* ---------- Arranque ---------- */
const h0=location.hash.replace('#','');if(VIEWS.includes(h0))S.view=h0;
setStatus();render();initStore();initSample();


if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
