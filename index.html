<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Diario de Macros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de 760px tipo "etiqueta nutricional": resumen arriba, comidas debajo, pestañas fijas arriba y botón de añadir flotante. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E8ECE5; --ink:#17201A; --muted:#5B685F; --line:#D6DDD3;
  --accent:#2D6A47; --accent-ink:#FFFFFF;
  --prot:#3456A6; --carb:#BE7F12; --fat:#B0436A; --water:#2A7FA8;
  --ok:#2B7A4B; --warn:#A86A10; --bad:#B23838;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E19; --sunk:#1F2821; --ink:#E6ECE7; --muted:#97A49B; --line:#2B352E;
  --accent:#72C394; --accent-ink:#0D1A12;
  --prot:#86A2EC; --carb:#E4B04F; --fat:#E681A3; --water:#6CC0E6;
  --ok:#6CC58F; --warn:#E3AE52; --bad:#EE7B7B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E19; --sunk:#1F2821; --ink:#E6ECE7; --muted:#97A49B; --line:#2B352E;
  --accent:#72C394; --accent-ink:#0D1A12;
  --prot:#86A2EC; --carb:#E4B04F; --fat:#E681A3; --water:#6CC0E6;
  --ok:#6CC58F; --warn:#E3AE52; --bad:#EE7B7B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:96px;accent-color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:14px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.status{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.cloud i{background:var(--ok)} .status.local i{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 24px}
.stack{display:flex;flex-direction:column;gap:18px}
h2.sec{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:var(--bad);font-size:.85rem;font-weight:600}

.datebar{display:flex;align-items:center;gap:8px}
.datebar .lbl{flex:1;min-width:0;text-align:center}
.datebar .lbl b{font-family:var(--display);font-size:1.25rem;font-weight:700;display:block;line-height:1.1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600}
.pillbtn:hover{border-color:var(--accent)}

/* segmentado (tipo de día, sexo, objetivo) */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.typebar{display:flex;flex-direction:column;gap:6px}
.typebar .hint b{color:var(--ink)}

/* etiqueta */
.label{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:14px 16px 12px}
.label .title{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:8px solid var(--ink);flex-wrap:wrap}
.label .title small{font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted)}
.energy{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;padding:10px 0 10px;border-bottom:3px solid var(--ink)}
.energy .big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:.95;letter-spacing:-.03em}
.energy .big small{font-size:1rem;font-weight:600;letter-spacing:0;margin-left:4px}
.energy .side{text-align:right;font-size:.82rem;color:var(--muted)}
.energy .side b{color:var(--ink);font-family:var(--mono);font-weight:600}
.split{grid-column:1/-1;display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--sunk);margin-top:8px}
.split span{display:block;height:100%}
.legend{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto 3.4rem;gap:10px;align-items:center;padding:7px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
button.lrow:hover .nm span:first-child{color:var(--accent)}
.lrow .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.lrow .nm span{font-weight:600}
.lrow .val{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:.88rem;white-space:nowrap}
.lrow .val small{color:var(--muted)}
.lrow .pct{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:600;font-size:.85rem}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;border-radius:3px;max-width:100%}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.bg-ok{background:var(--ok)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)}
details.micros{margin-top:6px;border-top:3px solid var(--ink)}
details.micros summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:.88rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.micros summary::-webkit-details-marker{display:none}
details.micros summary::after{content:"Mostrar";color:var(--accent);font-weight:600}
details.micros[open] summary::after{content:"Ocultar"}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}
@media (max-width:560px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.labelfoot{font-size:.74rem;color:var(--muted);padding-top:8px}

/* agua */
.water{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.water h3{margin:0;font-family:var(--display);font-size:1rem;font-weight:700}
.water .wv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.glasses{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.glasses svg{width:20px;height:26px}
.glasses .g-fill{fill:var(--water)} .glasses .g-empty{fill:none}
.glasses path.g-out{fill:none;stroke:var(--muted);stroke-width:1.4}
.wbtns{display:flex;gap:6px}

/* comidas */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.meal header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 8px}
.meal header h3{margin:0;font-family:var(--display);font-weight:700;font-size:1rem}
.meal header .num{font-size:.85rem;color:var(--muted)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.entry:hover{background:var(--sunk)}
.entry .n{font-weight:500;overflow-wrap:anywhere}
.entry .k{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.entry .s{grid-column:1/-1;font-size:.78rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.mealbtns{display:flex;border-top:1px dashed var(--line)}
.addline{flex:1;text-align:left;border:0;background:none;padding:10px 14px;color:var(--accent);font-weight:600;font-size:.88rem}
.addline + .addline{border-left:1px dashed var(--line);color:var(--muted);font-weight:500}
.addline:hover{background:var(--sunk)}
.mp{color:var(--prot)} .mc{color:var(--carb)} .mf{color:var(--fat)}

#fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:.95rem}
#fab:hover{filter:brightness(1.06)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{min-width:0}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.05;letter-spacing:-.02em}
.stat .v small{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:3px}
.stat .l{font-size:.76rem;color:var(--muted)}
@media (max-width:620px){.stats,.stats.three{grid-template-columns:repeat(2,minmax(0,1fr))}}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.68rem;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-width:0}
.cal button .d{font-size:.72rem;font-weight:600}
.cal button .kc{font-family:var(--mono);font-size:.62rem;align-self:flex-end;font-variant-numeric:tabular-nums}
.cal button.l1{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cal button.l2{background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.cal button.l3{background:color-mix(in srgb,var(--accent) 58%,var(--surface))}
.cal button.l4{background:color-mix(in srgb,var(--carb) 55%,var(--surface))}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .blank{aspect-ratio:1/1}
@media (min-width:620px){.cal button,.cal .blank{aspect-ratio:auto;height:56px}}
.callegend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:10px}
.callegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

.chart{display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
.chart .gtick{stroke:var(--ink);stroke-width:1.6}
.chart .b{fill:color-mix(in srgb,var(--accent) 70%,var(--surface))}
.chart .b.over{fill:var(--carb)}
.chart .b.cur{fill:var(--accent)}
.chart .pt{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .last{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .tlabel{fill:var(--ink);font-weight:600}

.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.86rem;min-width:460px}
table.t th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink)}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t td:first-child{font-family:var(--body)}
table.t td .bar{width:70px;display:inline-block;vertical-align:middle;margin-right:6px}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600;font-family:var(--body);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}

.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-size:1rem}
.search:focus{border-color:var(--accent);outline:none}
.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px;font-size:.88rem;max-width:100%}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;white-space:nowrap;font-weight:500}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.fitem:last-child{border-bottom:0}
.fitem:hover{background:var(--sunk)}
.fitem .n{font-weight:500;overflow-wrap:anywhere}
.fitem .n em{font-style:normal;font-size:.68rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.fitem .n .star{color:var(--carb);margin-left:5px}
.fitem .k{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.fitem .s{font-size:.76rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.fitem .c{font-size:.74rem;color:var(--muted);text-align:right}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:10px;font-weight:600;color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,15,12,.45)}
#sheet .panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){#sheet{align-items:center}#sheet .panel{border-radius:16px;max-height:88%}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.sh-head h3{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.sh-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.sh-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.small{padding:8px 14px;font-size:.88rem}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.grow{flex:1}
.gramrow{display:flex;align-items:center;gap:10px}
.gramrow input{width:7.5rem;font-family:var(--mono);font-size:1.6rem;font-weight:600;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:right}
.gramrow input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.preview div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.preview b{display:block;font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.preview span{font-size:.72rem;color:var(--muted)}
.ntable{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 12px}
.ntable div{padding:5px 0;border-bottom:1px solid var(--line)}
.ntable div:nth-last-child(-n+2){border-bottom:0}
.ntable div:nth-child(even){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:480px){.form.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
.form label.full,.form .full{grid-column:1/-1}
.form input,.form select{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-size:.95rem;color:var(--ink);min-width:0;width:100%}
.form input:focus,.form select:focus{border-color:var(--accent);outline:none}
.form input[type=number]{font-family:var(--mono)}
.form input:disabled{background:var(--sunk);color:var(--muted)}

function microRefs(sex,age){
  const m=sex==='m';let r;
  if(age<19) r=m?{kk:2300,ca:1300,fe:15,mg:360,zn:9,vc:65,va:700}:{kk:3000,ca:1300,fe:11,mg:410,zn:11,vc:75,va:900};

  if(age>70)r.ca=1200;

}
function weightKeys(){return Object.keys(S.weights).filter(k=>S.weights[k]&&S.weights[k].kg>0).sort()}

function calc(P=S.profile){
  const w=curWeight(),h=+P.height||170,a=+P.age||30;
  const bmr=10*w+6.25*h-5*a+(P.sex==='m'?-161:5);
  const tdee0=bmr*(+P.activity||1.55),calib=Math.max(-1000,Math.min(1000,+P.calib||0)),tdee=tdee0+calib;
  const sign=P.goal==='ganar'?1:P.goal==='perder'?-1:0;
  const delta=sign*(+P.rate||0)*7700/7;
  const floor=Math.max(P.sex==='m'?1200:1500,bmr);
  let kcal=Math.round((tdee+delta)/10)*10,clamped=false;
  if(kcal<floor){kcal=Math.round(floor/10)*10;clamped=true}
  const p=Math.round((+P.protKg||1.8)*w),f=Math.round(kcal*(+P.fatPct||28)/100/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {w,h,a,bmr,tdee0,calib,tdee,delta,kcal,clamped,goals:{k:kcal,p,c,f,fi:Math.round(kcal/1000*14),su:Math.round(kcal*0.1/4),sf:Math.round(kcal*0.1/9),...microRefs(P.sex,a)},water:Math.round(w*35/50)*50};
}

const WQ={};
function queueWrite(path,data){
  if(S.mode!=='db'){saveLocal();return}
  const q=WQ[path]||(WQ[path]={pending:undefined,busy:false});q.pending=data;if(!q.busy)flush(path);
}
async function flush(path){
  const q=WQ[path];q.busy=true;
  while(q.pending!==undefined){
    const d=q.pending;q.pending=undefined;
    for(let attempt=0;attempt<2;attempt++){
      try{ if(d===null) await DB.doc(dp(path)).delete(); else await DB.doc(dp(path)).set(d); break }
      catch(e){
        if(e&&e.code==='unavailable'&&attempt===0&&q.pending===undefined){await new Promise(r=>setTimeout(r,600+Math.random()*800));continue}
        if(e&&e.code==='invalid_argument'&&PFX){goLocal('Tu acceso a esta app no permite guardar en la nube: tus datos se guardan en este navegador.');q.pending=undefined;break}
        if(q.pending===undefined)toast(e&&e.code==='quota_exceeded'?'La base de datos está llena: borra días antiguos para seguir guardando.':'No se pudo guardar el cambio. Revisa la conexión y vuelve a intentarlo.');
        break;
      }
    }
  }
  q.busy=false;
}

  UNSUB.push(db.doc(dp('config/foods')).onSnapshot(s=>{const v=s.exists?s.data():null;S.foods=v&&Array.isArray(v.items)?v.items.map(f=>({...f,v:[...f.v],own:true})):[];got.foods=1;soft()},err));
  UNSUB.push(db.doc(dp('config/goals')).onSnapshot(s=>{const v=s.exists?s.data():null;S.goals={...DEFAULT_GOALS,...(v&&v.goals||{})};got.goals=1;soft()},err));
  UNSUB.push(db.doc(dp('config/profile')).onSnapshot(s=>{const v=s.exists?s.data():null;S.profileSet=!!v;S.profile={...DEF_PROFILE,...(v&&v.profile||{})};if(!Array.isArray(S.profile.week)||S.profile.week.length!==7)S.profile.week=[...DEF_PROFILE.week];got.profile=1;soft()},err));
  UNSUB.push(db.doc(dp('config/favs')).onSnapshot(s=>{const v=s.exists?s.data():null;S.favs=v&&Array.isArray(v.ids)?[...v.ids]:[];got.favs=1;soft()},err));
  UNSUB.push(db.doc(dp('config/plan')).onSnapshot(s=>{const v=s.exists?s.data():null;S.plan=v&&v.plan&&Array.isArray(v.plan.days)?clonePlan(v.plan):null;got.plan=1;soft()},err));
  UNSUB.push(db.collection(dp('photos')).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.img==='string'&&v.img.startsWith('data:image/'))o[d.id]=v.img});S.photos=o;got.photos=1;soft()},err));
  UNSUB.push(db.doc(dp('config/templates')).onSnapshot(s=>{const v=s.exists?s.data():null;S.templates=v&&Array.isArray(v.items)?v.items.map(t=>({...t,items:t.items.map(i=>({...i,b:[...i.b]}))})):[];got.templates=1;soft()},err));
  UNSUB.push(db.collection(dp('plans')).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.plan&&Array.isArray(v.plan.days))o[d.id]=clonePlan(v.plan)});S.plans=o;got.plans=1;soft()},err));
}

/* ---------- Render principal ---------- */
const V=document.getElementById('view');
const VIEWS=['hoy','mes','peso','dieta','recetas','alimentos','perfil','guia'];
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===S.view));
  document.getElementById('fab').hidden=!(S.view==='hoy'||S.view==='mes');
  if(S.view==='hoy')V.innerHTML=viewDay();
  else if(S.view==='mes')V.innerHTML=viewMonth();
  else if(S.view==='peso')V.innerHTML=viewWeight();
  else if(S.view==='dieta')V.innerHTML=viewDiet();
  else if(S.view==='recetas')V.innerHTML=viewRecipes();
  else if(S.view==='guia')V.innerHTML=viewGuide();
  else if(S.view==='alimentos')V.innerHTML=viewFoods();
  else V.innerHTML=viewProfile();
}
function bar(pct,cls,color){return `<div class="bar"><b class="${cls||''}" style="width:${Math.max(0,Math.min(100,pct)).toFixed(1)}%;${color?'background:'+color:''}"></b></div>`}
const MCOL={p:'var(--prot)',c:'var(--carb)',f:'var(--fat)',k:'var(--accent)'};

/* ----- Día ----- */
const GLASS_FULL='<svg viewBox="0 0 20 26" aria-hidden="true"><path class="g-fill" d="M4.6 9h10.8l-1.5 14H6.1z"/><path class="g-out" d="M2.5 2h15l-2.2 22H4.7z"/></svg>';
const GLASS_EMPTY='<svg viewBox="0 0 20 26" aria-hidden="true"><path class="g-out" d="M2.5 2h15l-2.2 22H4.7z"/></svg>';
function viewDay(){
  const k=S.cur,list=dayEntries(k),T=sumEntries(list),G=goalsFor(k),t=dayType(k),d=S.days[k];
  const isToday=k===todayKey();
  const dl=fdate(k,{weekday:'long',day:'numeric',month:'long'});
  const pk=T.p*4,ck=T.c*4,fk=T.f*9,tot=pk+ck+fk||1,rem=G.k-T.k,adj=+S.profile.adj||0;
  const row=(key,cls)=>{const pct=G[key]?T[key]/G[key]*100:0;const st=MCOL[key]?'':statusOf(key,T[key],G);
    return `<button class="lrow" data-nut="${key}" title="Ver qué alimentos aportan ${META[key].l.toLowerCase()}"><div class="nm"><span>${META[key].l}${META[key].t==='max'?' <small class="muted">(máx.)</small>':''}</span>${bar(pct,st?'bg-'+st:'',MCOL[key])}</div><div class="val">${fmtN(key,T[key])} <small>${MCOL[key]?'/ '+fmtN(key,G[key])+' ':''}${META[key].u}</small></div><div class="pct ${cls||st}">${fmt(pct)}%</div></button>`};
  const typeHint=adj?(t==='partido'?`Objetivo +${adj} kcal en hidratos para rendir en el partido`:t==='descanso'?`Objetivo −${adj} kcal en hidratos: hoy no entrenas`:'Objetivo base de día de entreno'):'Mismo objetivo todos los días';
  const fromWeek=!(d&&d.type);
  // agua
  const wml=(d&&d.water)||0,wg=waterGoal(k),slots=Math.max(Math.ceil(wg/250),Math.ceil(wml/250)),filled=Math.floor(wml/250);
  let glasses='';for(let i=0;i<slots;i++)glasses+=i<filled?GLASS_FULL:GLASS_EMPTY;
  // comidas
  const y=shiftKey(k,-1);let meals='';
  MEALS.forEach(([id,label])=>{
    const es=list.filter(e=>e.meal===id),mk=es.reduce((a,e)=>a+entryVals(e).k,0);
    const ye=dayEntries(y).filter(e=>e.meal===id);
    meals+=`<section class="meal"><header><h3>${label}</h3><span class="num">${es.length?fmt(mk)+' kcal · P '+fmt(es.reduce((a,e)=>a+entryVals(e).p,0))+' g':''}</span></header>`;
    es.forEach(e=>{const v=entryVals(e);meals+=`<button class="entry" data-edit="${esc(e.id)}"><span class="n">${esc(e.name)}</span><span class="k">${fmt(v.k)}</span><span class="s">${fmt(e.g)} g · <span class="mp">P ${fmt(v.p,1)}</span> · <span class="mc">HC ${fmt(v.c,1)}</span> · <span class="mf">G ${fmt(v.f,1)}</span></span></button>`});
    meals+=`<div class="mealbtns"><button class="addline" data-add="${id}">+ Añadir</button>${!es.length&&ye.length?`<button class="addline" data-repeat="${id}">Repetir la de ayer · ${fmt(ye.reduce((a,e)=>a+entryVals(e).k,0))} kcal</button>`:''}${es.length?`<button class="addline" data-tsave="${id}">Guardar como habitual</button>`:''}</div></section>`;
  });
  return `<div class="stack">
  <div class="datebar"><button class="iconbtn" data-day="-1" aria-label="Día anterior">‹</button><div class="lbl"><span class="eyebrow">${isToday?'Hoy':parseKey(k).getFullYear()}</span><b>${esc(dl)}</b></div><button class="iconbtn" data-day="1" aria-label="Día siguiente">›</button></div>
  ${isToday?'':'<div style="text-align:center;margin-top:-8px"><button class="pillbtn" data-today>Volver a hoy</button></div>'}
  ${S.ready&&!S.profileSet?`<div class="welcome"><b>Bienvenido a Diario de Macros</b><span>Empieza por tu perfil: con tu edad, altura, peso y actividad calculo tus calorías y macros.</span><button class="btn small" data-goto="perfil">Configurar mi perfil</button></div>`:''}
  <div class="typebar"><div class="seg" role="group" aria-label="Tipo de día">${DTYPES.map(([id,l])=>`<button data-dtype="${id}" aria-pressed="${t===id}">${l}</button>`).join('')}</div><span class="hint">${typeHint}${fromWeek?' · según tu semana tipo':''}</span>${(()=>{const s=streakInfo();return s.cur?`<span class="streak"><b class="num">${s.cur}</b> ${s.cur===1?'día':'días'} seguidos registrando${s.best>s.cur?` · récord ${s.best}`:s.cur>1?' · ¡tu récord!':''}</span>`:''})()}</div>
  <section class="label" aria-label="Resumen del día">
    <div class="title">Información nutricional <small>${list.length} ${list.length===1?'alimento':'alimentos'} · % de tu objetivo</small></div>
    <div class="energy">
      <div><span class="eyebrow">Valor energético</span><div class="big num">${fmt(T.k)}<small>kcal</small></div></div>
      <div class="side"><b>${fmt(T.k*4.184)}</b> kJ<br>${rem>=0?'quedan <b>'+fmt(rem)+'</b> kcal':'<span class="bad">+<b class="bad">'+fmt(-rem)+'</b> kcal sobre objetivo</span>'}</div>
      <div class="split" title="Reparto de energía">${list.length?`<span style="width:${pk/tot*100}%;background:var(--prot)"></span><span style="width:${ck/tot*100}%;background:var(--carb)"></span><span style="width:${fk/tot*100}%;background:var(--fat)"></span>`:''}</div>
      <div class="legend"><span><i style="background:var(--prot)"></i>Proteína ${fmt(pk/tot*100)}%</span><span><i style="background:var(--carb)"></i>Hidratos ${fmt(ck/tot*100)}%</span><span><i style="background:var(--fat)"></i>Grasa ${fmt(fk/tot*100)}%</span><span>Objetivo ${fmt(G.k)} kcal</span></div>
    </div>
    ${row('p','mp')}${row('c','mc')}${row('f','mf')}
    <details class="micros" ${localGet('microsOpen')==='0'?'':'open'}><summary>Fibra, azúcares y micronutrientes</summary><div class="mgrid">${MICRO.map(x=>row(x)).join('')}</div></details>
    <div class="labelfoot">Toca cualquier nutriente para ver qué alimentos te lo aportan. Proteína: ${fmt(T.p/curWeight(),1)} g/kg de peso corporal.</div>
    <div class="btnrow" style="margin-top:10px">${(SAMPLE&&SAMPLE_IMG)||STANDALONE?'<button class="btn small" data-snap="1">Foto de tu comida</button>':''}<button class="pillbtn" data-fill="1">¿Qué como ahora?</button>${SAMPLE?'<button class="pillbtn" data-aiopen="1">Escribir lo que comí</button>':''}</div>
  </section>
  <section class="water" aria-label="Agua">
    <div><h3>Agua</h3><span class="wv">${fmt(wml/1000,2)} / ${fmt(wg/1000,1)} L</span> <span class="hint">${wml>=wg?'· objetivo cumplido':'· faltan '+fmt((wg-wml)/1000,2)+' L'}</span></div>
    <div class="wbtns"><button class="iconbtn" data-water="-250" aria-label="Quitar 250 ml">−</button><button class="pillbtn" data-water="250">+250 ml</button><button class="pillbtn" data-water="500">+500 ml</button></div>
    <div class="glasses" title="Cada vaso son 250 ml">${glasses}</div>
  </section>
  ${planPanel(k)}
  ${!list.length&&dayEntries(y).length?`<button class="copyday" data-copyday="1">Copiar todo lo de ayer <span class="hint">${dayEntries(y).length} alimentos · ${fmt(sumEntries(dayEntries(y)).k)} kcal</span></button>`:''}
  ${meals}
  ${notesHTML(k)}
  </div>`;
}

/* ----- Mes ----- */
function monthKeys(m){const [y,mm]=m.split('-').map(Number);const n=new Date(y,mm,0).getDate();return Array.from({length:n},(_,i)=>m+'-'+String(i+1).padStart(2,'0'))}
function viewMonth(){
  const m=S.month,keys=monthKeys(m),today=todayKey(),nut=S.mnut;
  const [y,mm]=m.split('-').map(Number);
  const title=(t=>t.charAt(0).toUpperCase()+t.slice(1))(new Date(y,mm-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}));
  const per={},gl={};keys.forEach(k=>{gl[k]=goalsFor(k);const l=dayEntries(k);if(l.length)per[k]=sumEntries(l)});
  const logged=Object.keys(per),n=logged.length;
  const tot={},avg={},avgG={};NK.forEach(x=>{tot[x]=logged.reduce((a,k)=>a+per[k][x],0);avg[x]=n?tot[x]/n:0;avgG[x]=n?logged.reduce((a,k)=>a+gl[k][x],0)/n:gl[keys[0]][x]});
  const onTarget=logged.filter(k=>{const r=per[k].k/gl[k].k;return r>=0.9&&r<=1.1}).length;
  const wk=weightKeys().filter(k=>k.startsWith(m));const wchg=wk.length>1?S.weights[wk[wk.length-1]].kg-S.weights[wk[0]].kg:null;
  // calendario
  const first=(new Date(y,mm-1,1).getDay()+6)%7;
  let cal=WD.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)cal+='<div class="blank"></div>';
  keys.forEach((k,i)=>{const t=per[k];let lv='';if(t){const r=t.k/gl[k].k;lv=r<0.5?'l1':r<0.8?'l2':r<=1.1?'l3':'l4'}
    cal+=`<button class="${lv} ${k===today?'today':''}" data-goday="${k}" aria-label="${i+1}${t?': '+fmt(t.k)+' kcal':''}"><span class="d">${i+1}</span>${t?`<span class="kc">${fmt(t.k)}</span>`:''}</button>`});
  // gráfica del nutriente elegido
  const W=700,H=200,pl=44,pr=8,pt=10,pb=22,cw=(W-pl-pr)/keys.length;
  const maxV=Math.max(...keys.map(k=>gl[k][nut]||0),...logged.map(k=>per[k][nut]))*1.12||1;const sy=v=>pt+(H-pt-pb)*(1-v/maxV);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(META[nut].l)} por día">`;
  const gref=avgG[nut];[0,gref/2,gref].forEach(v=>{svg+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"/><text x="${pl-6}" y="${(sy(v)+3).toFixed(1)}" text-anchor="end">${fmtN(nut,v)}</text>`});
  keys.forEach((k,i)=>{const t=per[k],x=pl+i*cw;
    if(t){const g=gl[k][nut],over=META[nut].t==='max'?t[nut]>g:nut==='k'&&t[nut]>g*1.1;svg+=`<rect class="b ${k===today?'cur':over?'over':''}" x="${(x+cw*0.16).toFixed(1)}" y="${sy(t[nut]).toFixed(1)}" width="${(cw*0.68).toFixed(1)}" height="${Math.max(0,sy(0)-sy(t[nut])).toFixed(1)}" rx="2"><title>${i+1}: ${fmtN(nut,t[nut])} ${META[nut].u} (objetivo ${fmtN(nut,gl[k][nut])})</title></rect>`}
    svg+=`<line class="gtick" x1="${(x+cw*0.08).toFixed(1)}" x2="${(x+cw*0.92).toFixed(1)}" y1="${sy(gl[k][nut]).toFixed(1)}" y2="${sy(gl[k][nut]).toFixed(1)}"/>`;
    if(i===0||(i+1)%5===0)svg+=`<text x="${(x+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${i+1}</text>`});
  svg+='</svg>';
  // fuentes del nutriente
  const agg={};logged.forEach(k=>dayEntries(k).forEach(e=>{const a=agg[e.name]||(agg[e.name]={n:e.name,g:0,v:0,k:0,p:0,c:0});const v=entryVals(e);a.g+=e.g;a.v+=v[nut];a.k+=v.k;a.p+=v.p;a.c++}));
  const src=Object.values(agg).filter(a=>a.v>0).sort((a,b)=>b.v-a.v).slice(0,10);
  // por día de la semana
  const wdRows=WDL.map((lab,i)=>{const ds=logged.filter(k=>(parseKey(k).getDay()+6)%7===i);if(!ds.length)return '';const av=x=>ds.reduce((a,k)=>a+per[k][x],0)/ds.length;return `<tr><td>${lab}</td><td>${ds.length}</td><td>${fmt(av('k'))}</td><td>${fmt(av('p'))} g</td><td>${fmt(av('c'))} g</td>${nut!=='k'&&!['p','c'].includes(nut)?`<td>${fmtN(nut,av(nut))} ${META[nut].u}</td>`:''}</tr>`}).join('');
  const mrow=x=>{const pct=avgG[x]?avg[x]/avgG[x]*100:0;return `<tr class="click" data-mnut="${x}"><td>${META[x].l}</td><td>${fmtN(x,tot[x])} ${META[x].u}</td><td>${fmtN(x,avg[x])}</td><td>${fmtN(x,avgG[x])}</td><td>${bar(pct,'',MCOL[x])}${fmt(pct)}%</td></tr>`};
  const urow=x=>{const st=statusOf(x,avg[x],avgG);const pct=avgG[x]?avg[x]/avgG[x]*100:0;const lab=META[x].t==='max'?(st==='ok'?'Dentro del límite':st==='warn'?'Algo alto':'Excedido'):(st==='ok'?'Cubierto':st==='warn'?'Algo bajo':'Bajo');return `<tr class="click" data-mnut="${x}"><td>${META[x].l}</td><td>${fmtN(x,tot[x])} ${META[x].u}</td><td>${fmtN(x,avg[x])}</td><td>${META[x].t==='max'?'≤ ':''}${fmtN(x,avgG[x])}</td><td>${bar(pct,'bg-'+st)}${fmt(pct)}%</td><td><span class="chip ${st}">${lab}</span></td></tr>`};
  return `<div class="stack">
  <div class="datebar"><button class="iconbtn" data-month="-1" aria-label="Mes anterior">‹</button><div class="lbl"><span class="eyebrow">Resumen mensual</span><b>${esc(title)}</b></div><button class="iconbtn" data-month="1" aria-label="Mes siguiente">›</button></div>
  <div class="stats">
    <div class="card stat"><div class="v num">${n}<small>/ ${keys.length}</small></div><div class="l">días registrados · ${n?onTarget:0} en rango de kcal</div></div>
    <div class="card stat"><div class="v num">${fmt(avg.k)}<small>kcal</small></div><div class="l">media diaria · objetivo ${fmt(avgG.k)}</div></div>
    <div class="card stat"><div class="v num">${fmt(avg.p)}<small>g</small></div><div class="l">proteína media · ${fmt(n?avg.p/curWeight():0,1)} g/kg</div></div>
    <div class="card stat"><div class="v num">${wchg===null?'—':(wchg>0?'+':'')+fmt(wchg,1)}<small>${wchg===null?'':'kg'}</small></div><div class="l">${wchg===null?'apunta tu peso para verlo':'cambio de peso este mes'}</div></div>
  </div>
  ${badgesHTML()}
  ${SAMPLE&&n>=3?`<section class="card"><div class="listhead"><h2 class="sec">Análisis de ${aiName()==='IA'?'la IA':aiName()}</h2><button class="btn small" id="aimonth">${S.aiMonth[m]?'Analizar de nuevo':'Analizar mi mes'}</button></div><div id="aimonthout" class="aitext">${S.aiMonth[m]?mdLite(S.aiMonth[m]):'<p class="hint">Claude revisa tus medias, tus objetivos y lo que más comes, y te propone 3 cambios concretos. Usa tu cuenta de Claude.</p>'}</div></section>`:''}
  <section class="card"><div class="listhead"><h2 class="sec">Calendario</h2><span class="hint">Toca un día para abrirlo</span></div><div style="height:10px"></div><div class="cal">${cal}</div>
    <div class="callegend"><span><i style="background:color-mix(in srgb,var(--accent) 14%,var(--surface))"></i>&lt;50%</span><span><i style="background:color-mix(in srgb,var(--accent) 32%,var(--surface))"></i>50–80%</span><span><i style="background:color-mix(in srgb,var(--accent) 58%,var(--surface))"></i>80–110%</span><span><i style="background:color-mix(in srgb,var(--carb) 55%,var(--surface))"></i>&gt;110% del objetivo de kcal</span></div>${(()=>{const ds=keys.map(k=>S.days[k]).filter(Boolean),en=ds.filter(d=>d.energy),sl=ds.filter(d=>d.sleep);return en.length||sl.length?`<p class="hint" style="margin:8px 0 0">${en.length?`Energía media ${fmt(en.reduce((a,d)=>a+d.energy,0)/en.length,1)} de 5 (${en.length} días)`:''}${en.length&&sl.length?' · ':''}${sl.length?`Sueño medio ${fmt(sl.reduce((a,d)=>a+d.sleep,0)/sl.length,1)} h`:''}</p>`:''})()}</section>
  <section class="card"><div class="listhead"><h2 class="sec">${esc(META[nut].l)} por día</h2><select class="sel" id="mnut" aria-label="Nutriente de la gráfica">${NK.map(x=>`<option value="${x}" ${x===nut?'selected':''}>${META[x].l}</option>`).join('')}</select></div><div style="height:8px"></div>${svg}<p class="hint" style="margin:6px 0 0">Las marcas horizontales son tu objetivo de cada día (cambia según sea descanso, entreno o partido).</p></section>
  ${!n?`<div class="emptybox"><b>Aún no hay comidas este mes</b>Registra lo que comes en la pestaña Día y aquí verás totales, medias y qué micronutrientes te faltan.</div>`:`
  <section class="card"><h2 class="sec">Fuentes de ${esc(META[nut].l.toLowerCase())} este mes</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Alimento</th><th>Veces</th><th>Cantidad</th><th>${esc(META[nut].l)}</th><th>% del total</th></tr></thead><tbody>${src.map(a=>`<tr><td>${esc(a.n)}</td><td>${a.c}</td><td>${a.g>=1000?fmt(a.g/1000,2)+' kg':fmt(a.g)+' g'}</td><td>${fmtN(nut,a.v)} ${META[nut].u}</td><td>${bar(tot[nut]?a.v/tot[nut]*100:0,'',MCOL[nut]||'var(--accent)')}${fmt(tot[nut]?a.v/tot[nut]*100:0)}%</td></tr>`).join('')||'<tr><td colspan="5">Nada este mes.</td></tr>'}</tbody></table></div></section>
  <section class="card"><h2 class="sec">Energía y macronutrientes</h2><p class="hint" style="margin:4px 0 0">Toca una fila para verla en la gráfica.</p><div class="tbl-wrap"><table class="t"><thead><tr><th>Nutriente</th><th>Total del mes</th><th>Media/día</th><th>Objetivo medio</th><th>Media vs objetivo</th></tr></thead><tbody>${['k','p','c','f'].map(mrow).join('')}</tbody></table></div></section>
  <section class="card"><h2 class="sec">Micronutrientes</h2><p class="hint" style="margin:4px 0 0">Medias sobre los ${n} días con registros. Toca una fila para verla en la gráfica.</p><div class="tbl-wrap"><table class="t"><thead><tr><th>Nutriente</th><th>Total del mes</th><th>Media/día</th><th>Objetivo</th><th>Media vs objetivo</th><th>Estado</th></tr></thead><tbody>${MICRO.map(urow).join('')}</tbody></table></div></section>
  <section class="card"><h2 class="sec">Media por día de la semana</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Día</th><th>Días</th><th>kcal</th><th>Proteína</th><th>Hidratos</th>${nut!=='k'&&!['p','c'].includes(nut)?`<th>${esc(META[nut].l)}</th>`:''}</tr></thead><tbody>${wdRows}</tbody></table></div></section>
  <div><button class="pillbtn" id="exportCsv">Exportar CSV del mes</button></div>`}
  </div>`;
}

/* ----- Peso ----- */
function trendSlope(ks,days=28){if(ks.length<3)return null;const last=ks[ks.length-1];const pts=ks.filter(k=>daysBetween(k,last)<=days).map(k=>[daysBetween(ks[0],k),S.weights[k].kg]);if(pts.length<3||pts[pts.length-1][0]-pts[0][0]<6)return null;
  const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;let num=0,den=0;pts.forEach(p=>{num+=(p[0]-mx)*(p[1]-my);den+=(p[0]-mx)**2});return den?num/den*7:null}
function viewWeight(){
  const ks=weightKeys(),P=S.profile,cur=curWeight(),target=+P.target||cur,h=(+P.height||170)/100,today=todayKey();
  const last=ks[ks.length-1],lw=last?S.weights[last]:null;
  const bmi=cur/(h*h),bmiL=bmi<18.5?'bajo peso':bmi<25?'normal':bmi<30?'sobrepeso':'obesidad';
  let ch7=null;if(last){const ref=ks.filter(k=>k<=shiftKey(last,-7)).pop();if(ref)ch7=cur-S.weights[ref].kg}
  const slope=trendSlope(ks),need=target-cur;
  let eta='';if(Math.abs(need)<0.2)eta='Estás en tu peso objetivo';
  else if(slope&&Math.sign(slope)===Math.sign(need)&&Math.abs(slope)>0.02){const wks=need/slope;const dt=shiftKey(last||today,Math.round(wks*7));eta=`A tu ritmo actual, hacia el ${fdate(dt,{day:'numeric',month:'long',year:'numeric'})}`}
  else if(P.rate>0&&((need>0&&P.goal==='ganar')||(need<0&&P.goal==='perder'))){const wks=Math.abs(need)/P.rate;eta=`Con tu plan (${fmt(P.rate,2)} kg/sem): ~${fmt(wks)} semanas`}
  // gráfica
  let chart='';
  if(ks.length){
    const rng=S.wrange,from=rng==='all'?ks[0]:shiftKey(last,-(+rng));
    const pts=ks.filter(k=>k>=from);
    const x0=pts[0],x1=pts.length>1?pts[pts.length-1]:shiftKey(pts[0],3),span=Math.max(1,daysBetween(x0,x1));
    const vals=pts.map(k=>S.weights[k].kg).concat([target]);let lo=Math.min(...vals)-0.6,hi=Math.max(...vals)+0.6;
    const W=700,H=230,pl=40,pr=46,pt=12,pb=24;const sx=k=>pl+(W-pl-pr)*daysBetween(x0,k)/span,sy=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso">`;
    const step=(hi-lo)>6?2:(hi-lo)>3?1:0.5;for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"/><text x="${pl-6}" y="${(sy(v)+3).toFixed(1)}" text-anchor="end">${fmt(v,step<1?1:0)}</text>`;
    s+=`<line class="goal" x1="${pl}" x2="${W-pr}" y1="${sy(target).toFixed(1)}" y2="${sy(target).toFixed(1)}"/><text class="tlabel" x="${W-pr+4}" y="${(sy(target)+3).toFixed(1)}">obj. ${fmt(target,1)}</text>`;
    const avgPts=pts.map(k=>{const win=ks.filter(j=>j<=k&&daysBetween(j,k)<7);return [k,win.reduce((a,j)=>a+S.weights[j].kg,0)/win.length]});
    if(avgPts.length>1)s+=`<path class="avg" d="${avgPts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join('')}"/>`;
    pts.forEach((k,i)=>{const last=i===pts.length-1;s+=`<circle class="${last?'last':'pt'}" cx="${sx(k).toFixed(1)}" cy="${sy(S.weights[k].kg).toFixed(1)}" r="${last?5:3}"><title>${fdate(k)}: ${fmt(S.weights[k].kg,1)} kg</title></circle>`});
    [x0,pts.length>2?pts[Math.floor(pts.length/2)]:null,pts[pts.length-1]].filter((k,i,a)=>k&&a.indexOf(k)===i).forEach(k=>{s+=`<text x="${sx(k).toFixed(1)}" y="${H-6}" text-anchor="middle">${fdate(k)}</text>`});
    s+='</svg>';
    chart=`<section class="card"><div class="listhead"><h2 class="sec">Evolución</h2><div class="seg" role="group" aria-label="Rango" style="min-width:0">${[['30','30 días'],['90','90 días'],['365','1 año'],['all','Todo']].map(([v,l])=>`<button data-wrange="${v}" aria-pressed="${S.wrange===v}">${l}</button>`).join('')}</div></div><div style="height:8px"></div>${s}<p class="hint" style="margin:6px 0 0">Puntos: pesajes · Línea: media de 7 días (suaviza agua y comida del día) · Discontinua: tu objetivo.</p></section>`;
  }
  const hist=ks.slice().reverse().map((k,i,a)=>{const w=S.weights[k],prev=a[i+1]?S.weights[a[i+1]].kg:null,df=prev===null?null:w.kg-prev;
    return `<div class="hrow"><div class="d">${esc(fdate(k,{weekday:'short',day:'numeric',month:'short',year:'numeric'}))}${w.waist||w.bf?`<small>${w.waist?'cintura '+fmt(w.waist,1)+' cm':''}${w.waist&&w.bf?' · ':''}${w.bf?fmt(w.bf,1)+'% grasa':''}</small>`:''}</div><div class="w">${fmt(w.kg,1)} kg${df===null?'':`<small class="${df>0?'ok':df<0?'warn':'muted'}">${df>0?'+':''}${fmt(df,1)}</small>`}</div><button data-wdel="${k}" aria-label="Borrar pesaje del ${k}">Borrar</button></div>`}).join('');
  return `<div class="stack">
  <section class="card"><h2 class="sec">Apuntar peso</h2><p class="hint" style="margin:4px 0 10px">Pésate en ayunas, después del baño. Tus objetivos se recalculan con el último peso.</p>
    <div class="form three">
      <label>Fecha <input type="date" id="wdate" value="${today}" max="${today}"></label>
      <label>Peso (kg) <input type="number" id="wkg" inputmode="decimal" step="0.1" min="20" max="400" value="${lw?lw.kg:esc(P.weight)}"></label>
      <label>Cintura (cm, opcional) <input type="number" id="wwaist" inputmode="decimal" step="0.5" min="30" max="250" value="${lw&&lw.waist?lw.waist:''}"></label>
      <label>% grasa (opcional) <input type="number" id="wbf" inputmode="decimal" step="0.1" min="2" max="70" value="${lw&&lw.bf?lw.bf:''}"></label>
      <div class="full" style="display:flex;align-items:end"><button class="btn" id="wsave">Guardar pesaje</button></div>
    </div></section>
  <div class="stats">
    <div class="card stat"><div class="v num">${fmt(cur,1)}<small>kg</small></div><div class="l">peso actual · IMC ${fmt(bmi,1)} (${bmiL})</div></div>
    <div class="card stat"><div class="v num">${ch7===null?'—':(ch7>0?'+':'')+fmt(ch7,1)}<small>${ch7===null?'':'kg'}</small></div><div class="l">últimos 7 días</div></div>
    <div class="card stat"><div class="v num">${slope===null?'—':(slope>0?'+':'')+fmt(slope,2)}<small>${slope===null?'':'kg/sem'}</small></div><div class="l">${slope===null?'ritmo: necesitas 3 pesajes en 1 semana':'ritmo de las últimas 4 semanas'}</div></div>
    <div class="card stat"><div class="v num">${fmt(target,1)}<small>kg</small></div><div class="l">objetivo · ${Math.abs(need)<0.2?'conseguido':(need>0?'faltan ':'sobran ')+fmt(Math.abs(need),1)+' kg'}</div></div>
  </div>
  ${eta?`<p class="hint" style="margin:-6px 0 0">${esc(eta)}. Puedes cambiar el objetivo en Perfil y objetivos.</p>`:''}
  ${chart||`<div class="emptybox"><b>Aún no hay pesajes</b>Apunta tu peso arriba. Con 3 o más pesajes verás la tendencia y una fecha estimada para llegar a tu objetivo.</div>`}
  ${realTdeeHTML()}
  ${hist?`<section class="card"><h2 class="sec">Historial</h2><div class="hist">${hist}</div></section>`:''}
  </div>`;
}

/* ----- Alimentos ----- */
function isFav(id){return S.favs.includes(id)}
function foodRow(f,attr,extra){const v=f.v,pic=f.rec||f.ing;return `<button class="fitem${pic?' withimg':''}" ${attr}="${esc(f.id)}">${pic?dishPic(f,'thumb'):''}<span class="n">${esc(f.n)}${f.rec?'<em>Receta</em>':f.own?(f.ing?'<em>Plato</em>':'<em>Tuyo</em>'):''}${isFav(f.id)?'<span class="star" aria-label="favorito">★</span>':''}</span><span class="k">${extra?extra.r:fmt(v[0])+' kcal'}</span><span class="s">${extra&&extra.s?extra.s:`<span class="mp">P ${fmt(v[1],1)}</span> · <span class="mc">HC ${fmt(v[2],1)}</span> · <span class="mf">G ${fmt(v[3],1)}</span> · por 100 g`}</span><span class="c">${esc(CATS[f.cat]||'')}</span></button>`}
function filterFoods(q,cat){const toks=norm(q).split(/\s+/).filter(Boolean);return allFoods().filter(f=>(cat==='fav'?isFav(f.id):cat==='mine'?f.own:(!cat||f.cat===cat))&&toks.every(t=>norm(f.n).includes(t)))}
const SORTS=[['cat','Por categoría'],['p','Más proteína'],['pd','Proteína por kcal'],['kd','Más calorías'],['ka','Menos calorías'],['fi','Más fibra'],['az','A–Z']];
function sortFoods(l,s){const c=l.slice();const by=fn=>c.sort((a,b)=>fn(b)-fn(a));
  if(s==='p')by(f=>f.v[1]);else if(s==='pd')by(f=>f.v[0]>5?f.v[1]/f.v[0]:-1);else if(s==='kd')by(f=>f.v[0]);else if(s==='ka')c.sort((a,b)=>a.v[0]-b.v[0]);else if(s==='fi')by(f=>f.v[4]);else if(s==='az')c.sort((a,b)=>a.n.localeCompare(b.n,'es'));return c}
function catChips(sel,attr){return `<div class="cats" role="group" aria-label="Categorías"><button class="cat" ${attr}="" aria-pressed="${!sel}">Todas</button><button class="cat" ${attr}="fav" aria-pressed="${sel==='fav'}">★ Favoritos</button><button class="cat" ${attr}="mine" aria-pressed="${sel==='mine'}">Míos</button>${Object.entries(CATS).map(([k,l])=>`<button class="cat" ${attr}="${k}" aria-pressed="${sel===k}">${l}</button>`).join('')}</div>`}
function viewFoods(){
  return `<div class="stack">
  <div class="listhead"><div><h2 class="sec">Alimentos</h2><span class="hint">${allFoods().length} alimentos · valores por 100 g · ${S.foods.length} creados por ti</span></div><div class="btnrow"><button class="btn ghost small" id="newRecipe">+ Crear plato</button><button class="btn small" id="newFood">+ Nuevo alimento</button></div></div>
  <div class="searchrow"><input class="search" id="fq" type="search" placeholder="Buscar: pollo, avena, garbanzos…" value="${esc(S.q)}" autocomplete="off"><select class="sel" id="fsort" aria-label="Ordenar">${SORTS.map(([v,l])=>`<option value="${v}" ${S.sort===v?'selected':''}>${l}</option>`).join('')}</select></div>
  ${catChips(S.cat,'data-fcat')}
  <div id="flist">${foodListHTML()}</div></div>`;
}
function foodListHTML(){const l=sortFoods(filterFoods(S.q,S.cat),S.sort);
  if(!l.length)return S.cat==='fav'?`<div class="emptybox"><b>Sin favoritos todavía</b>Abre un alimento y pulsa la estrella para tenerlo siempre arriba al añadir comidas.</div>`:`<div class="emptybox"><b>Sin resultados</b>Prueba con otra palabra o crea el alimento con los valores de su etiqueta.</div>`;
  return `<div class="flist">${l.map(f=>foodRow(f,'data-food',S.sort==='pd'&&f.v[0]>5?{r:fmt(f.v[1]/f.v[0]*100,1)+' g',s:`proteína por cada 100 kcal · ${fmt(f.v[0])} kcal/100 g`}:null)).join('')}</div>`}

/* ----- Perfil ----- */
function sliderHTML(f,label,min,max,step,val,out){return `<div class="slider"><div class="top2"><span>${label}</span><output id="o-${f}">${out}</output></div><input type="range" data-prof="${f}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${esc(label)}"></div>`}
function outText(f){const P=S.profile,w=curWeight();
  if(f==='rate')return P.goal==='mantener'?'—':`${fmt(P.rate,2)} kg/sem (${fmt(P.rate/w*100,2)}% de tu peso)`;
  if(f==='protKg')return `${fmt(P.protKg,1)} g/kg · ${fmt(P.protKg*w)} g`;
  if(f==='fatPct')return `${fmt(P.fatPct)}% de las kcal`;
  if(f==='adj')return P.adj?`±${fmt(P.adj)} kcal`:'sin ajuste';return ''}
function viewProfile(){
  const P=S.profile,hasLog=weightKeys().length>0,auto=P.auto!==false;
  return `<div class="stack">
  <div><h2 class="sec">Perfil y objetivos</h2><p class="hint" style="margin:4px 0 0">Con tus datos calculo tu gasto diario y tus objetivos. Todo se guarda solo y el resultado se actualiza al momento.</p></div>
  <section class="card"><div class="form three">
    <div class="formsec" style="margin-top:0">Tus datos</div>
    <div class="full"><div class="seg" role="group" aria-label="Sexo">${[['h','Hombre'],['m','Mujer']].map(([v,l])=>`<button data-psex="${v}" aria-pressed="${P.sex===v}">${l}</button>`).join('')}</div></div>
    <label>Edad <input type="number" data-prof="age" inputmode="numeric" min="14" max="100" value="${esc(P.age)}"></label>
    <label>Altura (cm) <input type="number" data-prof="height" inputmode="decimal" min="120" max="230" value="${esc(P.height)}"></label>
    <label>Peso actual (kg) ${hasLog?`<input type="number" value="${fmt(curWeight(),1).replace(',','.')}" disabled><span class="hint">Del registro de Peso</span>`:`<input type="number" data-prof="weight" inputmode="decimal" min="30" max="300" step="0.1" value="${esc(P.weight)}">`}</label>
    <label>Peso objetivo (kg) <input type="number" data-prof="target" inputmode="decimal" min="30" max="300" step="0.1" value="${esc(P.target)}"></label>
  </div></section>
  <section class="card"><h2 class="sec">Actividad</h2><p class="hint" style="margin:4px 0 10px">Cuenta todo: gimnasio, entrenos y partidos. Si dudas entre dos, elige el más bajo y ajusta según tu peso.</p>
    <div class="actlist">${ACT.map(([f,l,d])=>`<button data-pact="${f}" aria-pressed="${+P.activity===f}"><span class="dot"></span><b>${l}</b><span class="f">×${f}</span><small>${d}</small></button>`).join('')}</div></section>
  <section class="card stack" style="gap:14px"><h2 class="sec">Objetivo</h2>
    <div class="seg" role="group" aria-label="Objetivo">${[['perder','Perder grasa'],['mantener','Mantener'],['ganar','Ganar músculo']].map(([v,l])=>`<button data-pgoal="${v}" aria-pressed="${P.goal===v}">${l}</button>`).join('')}</div>
    ${P.goal==='mantener'?'':sliderHTML('rate','Ritmo semanal',0.1,1,0.05,P.rate,outText('rate'))}
    ${P.goal==='ganar'?'<p class="hint" style="margin:-6px 0 0">Para ganar sobre todo músculo se suele recomendar un 0,25–0,5% del peso por semana.</p>':P.goal==='perder'?'<p class="hint" style="margin:-6px 0 0">Entre un 0,5% y un 1% del peso por semana ayuda a conservar músculo.</p>':''}
    ${sliderHTML('protKg','Proteína',1.2,2.6,0.1,P.protKg,outText('protKg'))}
    ${sliderHTML('fatPct','Grasa',20,40,1,P.fatPct,outText('fatPct'))}
    <p class="hint" style="margin:-6px 0 0">Los hidratos ocupan el resto de las calorías.</p>
  </section>
  <section class="card stack" style="gap:12px"><h2 class="sec">Semana tipo y periodización</h2><p class="hint" style="margin:0">Toca un día para cambiar su tipo. Cada día puedes cambiarlo también desde la pestaña Día.</p>
    <div class="weekrow">${WD.map((d,i)=>`<button class="t-${P.week[i]}" data-pweek="${i}" aria-label="${WDL[i]}: ${typeLabel(P.week[i])}"><b>${d}</b><span>${typeLabel(P.week[i])}</span></button>`).join('')}</div>
    ${sliderHTML('adj','Ajuste de hidratos por tipo de día',0,600,50,P.adj,outText('adj'))}
    <p class="hint" style="margin:-4px 0 0">En días de partido se suman esas kcal en hidratos y en días de descanso se restan.</p>
  </section>
  <section class="results" id="profRes" aria-live="polite">${profResHTML()}</section>
  <section class="card stack" style="gap:12px">
    <label class="switch"><input type="checkbox" id="pauto" ${auto?'checked':''}> Calcular los objetivos automáticamente con mi perfil</label>
    ${auto?`<div><span class="eyebrow">Objetivos de un día de entreno</span><div class="ntable" style="margin-top:6px">${NK.map(x=>`<div>${META[x].l}${META[x].t==='max'?' (máx.)':''}</div><div>${fmtN(x,calc().goals[x])} ${META[x].u}</div>`).join('')}</div><p class="hint" style="margin:8px 0 0">Micronutrientes: ingestas de referencia para tu sexo y edad. Fibra: 14 g por cada 1.000 kcal. Azúcares y saturadas: 10% de las kcal.</p></div>`:
    `<div class="form"><p class="hint full" style="margin:0">Modo manual: escribe tus propios objetivos de un día de entreno. El ajuste por tipo de día se sigue aplicando.</p>${NK.map(k=>`<label>${META[k].l}${META[k].t==='max'?' (máx.)':''} <input type="number" inputmode="decimal" min="0" step="any" data-goal="${k}" value="${S.goals[k]}"><span class="hint">${META[k].u}/día</span></label>`).join('')}</div>`}
  </section>
  ${apiKeyHTML()}
  <section class="card stack" style="gap:10px" id="importBox"><h2 class="sec">Copia de seguridad</h2><p class="hint" style="margin:0">Descarga todos tus datos (días, pesajes, alimentos, dietas, perfil) en un archivo y restáuralos cuando quieras.</p>
    ${PENDING_IMPORT?`<div class="notice">La copia del ${esc(String(PENDING_IMPORT.exported||'').slice(0,10))} tiene ${Object.keys(PENDING_IMPORT.days||{}).length} días, ${Object.keys(PENDING_IMPORT.weights||{}).length} pesajes y ${(PENDING_IMPORT.foods||[]).length} alimentos tuyos. Los días y pesajes de la copia sustituyen a los mismos días actuales; el resto se mantiene.</div><div class="btnrow"><button class="btn small" id="importGo">Restaurar copia</button><button class="pillbtn" id="importCancel">Cancelar</button></div>`:
    `<div class="btnrow"><button class="btn ghost small" id="exportBackup">Descargar copia</button><label class="pillbtn filebtn">Restaurar desde archivo<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>`}
  </section>
  <div><button class="btn ghost small" id="resetProfile">Restablecer perfil</button></div>
  <p class="hint">Los cálculos usan la ecuación de Mifflin-St Jeor y un factor de actividad, y 7.700 kcal por kg de cambio de peso. Son una estimación de partida: si en 2–3 semanas tu peso no va al ritmo previsto, sube o baja unas 150 kcal. Los valores de los alimentos son orientativos (tablas USDA/BEDCA).</p>
  </div>`;
}
function profResHTML(){
  const r=calc(),P=S.profile,g=r.goals,kc=g.p*4+g.c*4+g.f*9||1,adj=+P.adj||0;
  const need=(+P.target||r.w)-r.w;let eta='';
  if(Math.abs(need)>=0.2&&P.goal!=='mantener'&&Math.sign(need)===(P.goal==='ganar'?1:-1)&&P.rate>0){const wks=Math.abs(need)/P.rate;eta=`Llegarías a ${fmt(+P.target,1)} kg en unas ${fmt(wks)} semanas (${fdate(shiftKey(todayKey(),Math.round(wks*7)),{month:'long',year:'numeric'})}).`}
  else if(Math.abs(need)>=0.2&&P.goal!=='mantener'&&Math.sign(need)!==(P.goal==='ganar'?1:-1))eta=`Ojo: tu objetivo de peso (${fmt(+P.target,1)} kg) va en dirección contraria a "${P.goal==='ganar'?'ganar':'perder'}".`;
  const notes=[];
  if(r.clamped)notes.push('He limitado las calorías para no bajar de tu metabolismo basal. Para perder más rápido, mejor aumenta la actividad que recortar más.');
  if(P.goal!=='mantener'&&P.rate/r.w*100>1)notes.push('Ese ritmo supera el 1% de tu peso por semana: es agresivo y cuesta mantenerlo.');
  if(g.c<130&&P.goal!=='perder')notes.push('Te quedan pocos hidratos para tu nivel de actividad; baja algo la grasa o la proteína.');
  if(eta.startsWith('Ojo'))notes.push(eta);
  const dayRow=t=>{const gg={...g};if(t==='partido'){gg.k+=adj;gg.c+=Math.round(adj/4)}else if(t==='descanso'){const cut=Math.min(adj,gg.c*4);gg.k-=cut;gg.c-=Math.round(cut/4)}return `<tr><td>${typeLabel(t)}</td><td>${fmt(gg.k)}</td><td>${fmt(gg.p)} g</td><td>${fmt(gg.c)} g</td><td>${fmt(gg.f)} g</td><td>${fmt(r.water/1000+(t==='descanso'?0:0.5),1)} L</td></tr>`};
  const bmi=r.w/((r.h/100)**2);
  return `<span class="eyebrow">Tu objetivo diario (día de entreno)</span>
  <div class="kc num">${fmt(r.kcal)}<small>kcal</small></div>
  <div class="flow"><span>Basal <b>${fmt(r.bmr)}</b></span><span>× ${fmt(+P.activity,3)} actividad</span><span>= gasto <b>${fmt(r.tdee0)}</b></span>${r.calib?`<span>${r.calib>0?'+':'−'} <b>${fmt(Math.abs(r.calib))}</b> ajuste real</span>`:''}<span>${r.delta>=0?'+':'−'} <b>${fmt(Math.abs(r.delta))}</b> ${P.goal==='ganar'?'superávit':P.goal==='perder'?'déficit':''}</span></div>
  <div class="macro3"><div><b class="mp">${fmt(g.p)} g</b><span>proteína · ${fmt(g.p*4/kc*100)}%</span></div><div><b class="mc">${fmt(g.c)} g</b><span>hidratos · ${fmt(g.c*4/kc*100)}% · ${fmt(g.c/r.w,1)} g/kg</span></div><div><b class="mf">${fmt(g.f)} g</b><span>grasa · ${fmt(g.f*9/kc*100)}%</span></div></div>
  <div class="tbl-wrap" style="margin-top:12px"><table class="t" style="min-width:420px"><thead><tr><th>Tipo de día</th><th>kcal</th><th>Prot.</th><th>Hidratos</th><th>Grasa</th><th>Agua</th></tr></thead><tbody>${['descanso','entreno','partido'].map(dayRow).join('')}</tbody></table></div>
  <p class="hint" style="margin:10px 0 0">IMC ${fmt(bmi,1)} · ${eta&&!eta.startsWith('Ojo')?esc(eta):'Pon un peso objetivo para ver cuánto tardarías.'}</p>

function remainingToday(){const G=goalsFor(S.cur),T=sumEntries(dayEntries(S.cur));return {k:G.k-T.k,p:G.p-T.p,c:G.c-T.c,f:G.f-T.f}}
function genFill(st){
  const rem=remainingToday(),pr=dietPrefs(),G=goalsFor(S.cur);st.rem=rem;st.day=null;if(rem.k<150)return;
  const meal=st.meal,lc=pr.style==='lowc';
  const share=meal==='comida'||meal==='cena'?0.32:meal==='desayuno'?0.25:0.15;
  const cap=G.k*share;let f=1;if(rem.k>cap*1.35)f=cap/rem.k;
  const key=meal==='comida'||meal==='cena'?meal:meal==='desayuno'?'desayuno':'merienda';
  let slots;
  if(key==='comida'||key==='cena')slots=['prot_main',lc?'carb_lc':'carb_main','veg','fat'];
  else if(key==='desayuno')slots=lc?['b_prot','b_prot2','avo_nuts']:['b_carb','b_prot','fruit'];
  else slots=rem.p*f>12?['s_prot',lc?'berries':'s_carb']:['s_carb','fruit'];
  if(key==='merienda'&&rem.f*f>15)slots.push('nuts');
  const used=new Set(dayEntries(S.cur).map(e=>e.fid));
  const day={type:dayType(S.cur),meals:[{key,label:'',meal,frac:1,items:slots.map(r=>pickItem(r,pr,key,used,new Set())).filter(Boolean)}]};
  const T={k:Math.max(100,rem.k*f),p:Math.max(3,rem.p*f),c:Math.max(5,rem.c*f),f:Math.max(2,rem.f*f)};
  optimizeDay(day,T);st.day=day;st.T=T;st.key=key;st.partial=f<1;
}

/* ---------- Gasto real a partir de tu registro y tu peso ---------- */
function realTdee(){
  const today=todayKey(),from=shiftKey(today,-27);
  const days=Object.keys(S.days).filter(k=>k>=from&&k<=today&&dayEntries(k).length>=2).map(k=>({k,T:sumEntries(dayEntries(k))})).filter(d=>d.T.k>=800);
  const ws=weightKeys().filter(k=>k>=from&&k<=today),span=ws.length>1?daysBetween(ws[0],ws[ws.length-1]):0;
  const need={days:Math.max(0,10-days.length),weights:Math.max(0,4-ws.length),span:Math.max(0,14-span)};
  if(need.days||need.weights||need.span)return {ok:false,need,nd:days.length,nw:ws.length,span};
  const intake=days.reduce((a,d)=>a+d.T.k,0)/days.length;
  const xs=ws.map(k=>daysBetween(ws[0],k)),ys=ws.map(k=>S.weights[k].kg),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});const slope=den?num/den:0;
  const tdee=intake-slope*7700,base=calc().tdee0;
  return {ok:true,intake,slopeW:slope*7,tdee,base,diff:tdee-base,nd:days.length,nw:ws.length}}
function realTdeeHTML(){
  const r=realTdee(),cal=+S.profile.calib||0;
  if(!r.ok){const pct=Math.min(100,((10-r.need.days)/10+(4-r.need.weights)/4+(14-r.need.span)/14)/3*100);
    return `<section class="card"><h2 class="sec">Tu gasto real</h2><p class="hint" style="margin:4px 0 8px">Cruzando lo que comes con cómo cambia tu peso, la app calcula cuánto gastas de verdad y corrige la estimación de la fórmula. Necesita 4 semanas de datos.</p>${bar(pct,'','var(--accent)')}<p class="hint" style="margin:8px 0 0">En los últimos 28 días tienes ${r.nd} días completos registrados (necesito 10) y ${r.nw} pesajes (necesito 4, separados al menos 2 semanas).${cal?` Ahora mismo usas un ajuste de ${cal>0?'+':''}${fmt(cal)} kcal. <button class="pillbtn" id="calibOff">Quitar ajuste</button>`:''}</p></section>`}
  const big=Math.abs(r.diff)>=80,applied=Math.abs(cal-Math.round(r.diff/10)*10)<40&&cal!==0;
  return `<section class="card"><h2 class="sec">Tu gasto real</h2>
  <div class="flow" style="margin:6px 0 4px"><span>Comes de media <b>${fmt(r.intake)}</b> kcal</span><span>· tu peso cambia <b>${r.slopeW>0?'+':''}${fmt(r.slopeW,2)}</b> kg/sem</span><span>→ gastas unas <b>${fmt(r.tdee)}</b> kcal/día</span></div>
  <p class="hint" style="margin:0 0 10px">La fórmula estimaba ${fmt(r.base)} kcal: ${Math.abs(r.diff)<30?'casi igual que tu gasto real':`gastas unas ${fmt(Math.abs(r.diff))} kcal ${r.diff>0?'más':'menos'} de lo que calculaba`}. Calculado con ${r.nd} días registrados y ${r.nw} pesajes. Solo es fiable si apuntas todo lo que comes.</p>
  <div class="btnrow">${applied?'<span class="chip ok">Tus objetivos ya usan tu gasto real</span>':big?`<button class="btn small" id="calibOn">Usar mi gasto real en los objetivos</button>`:'<span class="chip ok">La fórmula se ajusta bien a ti</span>'}${cal?'<button class="pillbtn" id="calibOff">Volver a la fórmula</button>':''}</div></section>`}

  else if(sauceC.length){const sc0=sauceC[0];const share=sc0.g/comps.reduce((a,c)=>a+c.g,0);const rr=IR*Math.min(0.78,0.45+share*.8);

  const items=isBowl?solids.slice(1).concat(solids[0]&&sauceC.length?[solids[0]]:[]).slice(0,4):solids;

  tops.forEach(c=>{if(c.t==='sprinkle'){for(let i=0;i<26;i++){const a=rnd(0,Math.PI*2),r=Math.sqrt(R())*IR*.85;s+=`<circle cx="${(cx+Math.cos(a)*r).toFixed(1)}" cy="${(cy+Math.sin(a)*r*.86).toFixed(1)}" r="${rnd(.6,1.2).toFixed(1)}" fill="${c.c}"/>`}}

function tolerantJSON(t){try{return JSON.parse(t)}catch(e){}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}

function apiDetail(r,j){let o=Array.isArray(j)?j[0]:j;let er=o&&o.error!==undefined?o.error:o;

function httpErr(r,j){const e=httpErrCode(r,j);e.detail=apiDetail(r,j);return e}
function httpErrCode(r,j){const msg=JSON.stringify(j||{}).toLowerCase();
  if(r.status===401||r.status===403||/api_key_invalid|invalid api key|invalid x-api-key|incorrect api key/.test(msg))return apiErr('bad_key','clave');

  if(r.status===429||r.status===529)return apiErr('rate_limited','límite');

async function discoverModel(c){
  if(c.prov==='gemini'){const {r,j}=await getJSON('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':c.key}});if(!r.ok)throw httpErr(r,j);
    const ms=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))
      .filter(n=>/^gemini/.test(n)&&!/image|tts|live|audio|embed|computer|thinking-exp|learnlm|robotics/.test(n));
    const score=n=>(/flash/.test(n)?100:0)+(/lite/.test(n)?-20:0)+(/preview|exp/.test(n)?-15:0)+(/latest/.test(n)?5:0)+parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1])*3;
    ms.sort((a,b)=>score(b)-score(a));if(!ms.length)throw apiErr('model_missing','sin modelos');return ms[0]}
  if(c.prov==='anthropic'){const {r,j}=await getJSON('https://api.anthropic.com/v1/models?limit=100',{headers:{'x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});if(!r.ok)throw httpErr(r,j);
    const ids=(j.data||[]).map(m=>m.id);const pick=ids.find(i=>/sonnet/.test(i))||ids.find(i=>/opus/.test(i))||ids[0];if(!pick)throw apiErr('model_missing','sin modelos');return pick}
  const base=(c.base||'https://api.openai.com/v1').replace(/\/+$/,'');
  const {r,j}=await getJSON(base+'/models',{headers:{authorization:'Bearer '+c.key}});if(!r.ok)throw httpErr(r,j);
  const ids=(j.data||[]).map(m=>m.id).filter(i=>!/audio|realtime|tts|transcri|whisper|embed|image|dall|search|moderation|davinci|babbage|codex|instruct/.test(i));
  const score=i=>(/mini/.test(i)?40:0)+(/gpt|vision|vl|llava|gemma|qwen|llama.*vision/.test(i)?30:0)+(/nano/.test(i)?-10:0)+parseFloat((i.match(/(\d+(?:\.\d+)?)/)||[0,0])[1]);
  ids.sort((a,b)=>score(b)-score(a));if(!ids.length)throw apiErr('model_missing','sin modelos');return ids[0]}
async function callProvider(c,model,content,jsonMode,signal){
  if(c.prov==='gemini'){
    const parts=content.map(x=>x.type==='image'?{inline_data:{mime_type:'image/jpeg',data:x.data}}:{text:x.text});
    const {r,j}=await getJSON(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',signal,headers:{'content-type':'application/json','x-goog-api-key':c.key},
      body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0.2,maxOutputTokens:4096,...(jsonMode?{responseMimeType:'application/json'}:{})}})});
    if(!r.ok)throw httpErr(r,j);

  if(c.prov==='anthropic'){
    const cont=content.map(x=>x.type==='image'?{type:'image',source:{type:'base64',media_type:'image/jpeg',data:x.data}}:{type:'text',text:x.text});
    const {r,j}=await getJSON('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:2500,messages:[{role:'user',content:cont}]})});
    if(!r.ok)throw httpErr(r,j);
    return {text:(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''),truncated:j.stop_reason==='max_tokens'}}

  const cont=content.map(x=>x.type==='image'?{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+x.data}}:{type:'text',text:x.text});
  const {r,j}=await getJSON(base+'/chat/completions',{method:'POST',signal,headers:{'content-type':'application/json',authorization:'Bearer '+c.key},
    body:JSON.stringify({model,messages:[{role:'user',content:cont}],max_completion_tokens:2500,...(jsonMode?{response_format:{type:'json_object'}}:{})})});

async function runSnap(fixText){

- Estima los gramos por el tamaño del plato (unos 26 cm), los cubiertos, la mano o el envase si se ven. Sé realista con raciones españolas.
- Incluye el aceite o las salsas cuando se aprecian brillos, fritura o aliño, y dilo en "supuestos".
- Si algo no está en la lista, ponlo en "nuevos" con valores estimados por 100 g: k (kcal), p, c (hidratos sin fibra), f, fi, su, sf en g y na (sodio) en mg.
- "conf" es tu confianza en cada alimento: "alta", "media" o "baja".
- "supuestos": 1 a 4 frases muy cortas con lo que no se ve seguro (aceite, salsa, tamaño, ingredientes ocultos).
- Si la imagen no muestra comida, devuelve {"error":"no es comida"}.
${fixText?`
Ya hiciste un primer análisis:
${prev||'(vacío)'}

  if(ds.snapg){const [i,d]=ds.snapg.split('|').map(Number);const x=st.res[i];x.g=Math.max(0,Math.round((x.g+d)/Math.abs(d))*Math.abs(d));drawSnap();return true}
